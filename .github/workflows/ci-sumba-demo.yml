name: CI SUMBA Demonstration
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static regression tests
        run: |
          node --test tests/sumba-v022.test.cjs tests/sumba-cestos-pagamento.test.cjs tests/sumba-onboarding-brand.test.cjs tests/sumba-entrada-visitante.test.cjs tests/sumba-cinematic-reference.test.cjs
      - name: Validate isolated real authentication
        run: |
          node tests/auth-contract.mjs
          node scripts/test-sumba-auth-runtime.mjs
      - name: Verify static resources
        run: |
          test -f public/assets/sumba-icon.svg
          test -f public/real/assets/sumba-icon.svg
          test -f wrangler.sumba.jsonc
