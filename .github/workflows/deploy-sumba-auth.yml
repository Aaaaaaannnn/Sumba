name: Deploy SUMBA Auth (manual)
on:
  push:
    branches: [main]
    paths:
      - public/real/real.js
      - public/real/real.css
      - .github/workflows/deploy-sumba-auth.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sumba-auth-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authentication files
        run: |
          node tests/auth-contract.mjs
          node scripts/test-sumba-auth-runtime.mjs
      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = "true" && test "$HAS_ACCOUNT" = "true" || (echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets" && exit 1)
      - name: Deploy isolated authentication Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.auth.jsonc
      - name: Verificar publicação e segurança HTTP
        run: node scripts/check-sumba-auth.mjs
