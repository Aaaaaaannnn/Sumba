name: Deploy SUMBA onboarding visuals (main demo only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-sumba-onboarding.yml
      - public/index.html
      - index.html
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sumba-demo-onboarding-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test demo without changing real authentication
        run: |
          node --test tests/sumba-v022.test.cjs tests/sumba-cestos-pagamento.test.cjs tests/sumba-onboarding-brand.test.cjs tests/sumba-cinematic-reference.test.cjs tests/sumba-entrada-visitante.test.cjs
          node tests/auth-contract.mjs
      - name: Check existing Cloudflare deploy credentials
        env:
          HAS_API: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_API" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "Cloudflare credentials missing; aborting publish."
            exit 1
          fi
      - name: Deploy only current public demo Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.jsonc
      - name: Verify published HTML and all four local image assets
        run: |
          node --input-type=module -e '
            const base="https://zunga.stivenluanda04.workers.dev";
            const paths=["/","/assets/sumba-brand-original.svg","/assets/sumba-onboarding-market.svg","/assets/sumba-onboarding-farmers.svg","/assets/sumba-onboarding-produce.svg"];
            for (const p of paths) {
              let verified=false,latest="";
              for (let attempt=1;attempt<=8;attempt++) {
                const url=base+p+(p==="/"?"?sumba_onboard_check="+Date.now()+"_"+attempt:"?v=20261123_"+attempt);
                const response=await fetch(url,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
                latest=await response.text();
                const ok=response.ok&&(p==="/"?latest.includes("sumba-cinematic")&&latest.includes("sumbaVisitorForm")&&latest.includes("sumbaGuestBrowsing"):latest.includes("data:image/webp;base64,")&&latest.length>10000);
                if(ok){console.log("Verified "+p+" ("+latest.length+" chars), attempt "+attempt);verified=true;break}
                console.log("Retry "+p+": HTTP "+response.status+", bytes "+latest.length+", type "+(response.headers.get("content-type")||"?"));
                await new Promise(resolve=>setTimeout(resolve,2500));
              }
              if(!verified)throw Error("The published "+p+" did not match the new onboarding. First chars: "+latest.slice(0,180));
            }
          '
