<div class="app"><aside class="sidebar"><div class="brand"><span class="brandicon">🌱</span><div>ZUNGA<small>Do campo ao mercado</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">🇦🇴 Mercado agrícola angolano<br>Protótipo V2 · Ambiente de demonstração</div></aside><div class="shell"><header class="top"><div class="brand mobilebrand"><span class="brandicon">🌱</span>ZUNGA</div><div class="desktopheading"><strong>Mercado agrícola</strong><br><small id="topLabel"></small></div><div class="role"><label for="role" class="muted">Perfil demo</label><select id="role"><option value="buyer">Cliente</option><option value="producer">Produtor</option><option value="company">Empresa</option></select></div></header><main class="content" id="view"></main></div></div><nav class="bottom" id="bottom"></nav><dialog class="dialog" id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button class="close" id="closeDialog" aria-label="Fechar">×</button></div><div id="dialogBody"></div></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(), money=n=>new Intl.NumberFormat('pt-AO',{maximumFractionDigits:0}).format(Number(n)||0)+' Kz', uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const provinces=['Bengo','Benguela','Bié','Cabinda','Cuando','Cubango','Cuanza Norte','Cuanza Sul','Cunene','Huambo','Huíla','Icolo e Bengo','Luanda','Lunda Norte','Lunda Sul','Malanje','Moxico','Moxico Leste','Namibe','Uíge','Zaire'];
const cats=['Todos','Cereais','Tubérculos','Hortícolas','Frutas','Leguminosas','Outros'], symbols={'Cereais':'🌽','Tubérculos':'🥔','Hortícolas':'🥬','Frutas':'🍊','Leguminosas':'🫘','Outros':'🌱'};
const sampleStalls=[{id:'s1',name:'Bancada da Chibia',province:'Huíla',city:'Chibia',bio:'Hortícolas e cereais da produção familiar.',emoji:'🌾'},{id:'s2',name:'Horta do Humpata',province:'Huíla',city:'Humpata',bio:'Produtos frescos e colheitas sazonais.',emoji:'🥬'},{id:'s3',name:'Quinta do Planalto',province:'Huambo',city:'Caála',bio:'Grãos e leguminosas para comércio a grosso.',emoji:'🚜'}];
const initial=[{id:'p1',stall:'s1',name:'Batata rena',cat:'Tubérculos',price:18000,unit:'saco',stock:80,emoji:'🥔',offer:true},{id:'p2',stall:'s1',name:'Milho branco',cat:'Cereais',price:9500,unit:'saco',stock:120,emoji:'🌽'},{id:'p3',stall:'s2',name:'Tomate fresco',cat:'Hortícolas',price:4500,unit:'caixa',stock:55,emoji:'🍅',offer:true},{id:'p4',stall:'s3',name:'Feijão catarino',cat:'Leguminosas',price:22000,unit:'saco',stock:90,emoji:'🫘'},{id:'p5',stall:'s2',name:'Cenoura',cat:'Hortícolas',price:3000,unit:'caixa',stock:45,emoji:'🥕'},{id:'p6',stall:'s3',name:'Banana',cat:'Frutas',price:3500,unit:'kg',stock:300,emoji:'🍌'}].map(p=>({...p,demo:true}));
const key='zunga-v2';let db={role:'buyer',province:'',products:[],stall:{id:'mine',name:'A minha bancada',province:'Huíla',city:'Lubango',bio:'',phone:'',emoji:'🌱'},favorites:[],orders:[],quotes:[],campaigns:[],views:{},searches:[]};
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&Array.isArray(old.products)&&Array.isArray(old.orders))db={...db,...old}}catch{}
let role=['buyer','producer','company'].includes(db.role)?db.role:'buyer',tab='home',query='',category='Todos',province='',sort='recommended',onlyOffers=false,onlySaved=false,activeStall=null,toastTimer;
const navs={buyer:[['home','⌂','Início'],['market','⌕','Explorar'],['stalls','▦','Bancadas'],['orders','▣','Pedidos'],['profile','◎','Perfil']],producer:[['home','⌂','Painel'],['catalog','▦','Catálogo'],['orders','▣','Pedidos'],['promote','↗','Promoções'],['profile','◎','Bancada']],company:[['home','⌂','Painel'],['market','⌕','Compras'],['quotes','▤','Cotações'],['orders','▣','Pedidos'],['profile','◎','Empresa']]};
const stages=['Solicitado','Confirmado','Em preparação','Em transporte','Entregue'];
const allProducts=()=>[...db.products,...initial],allStalls=()=>[...sampleStalls,db.stall],stallOf=p=>allStalls().find(s=>s.id===p.stall)||db.stall,productOf=id=>allProducts().find(p=>p.id===id);
function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch{toast('Armazenamento cheio. Reduz o tamanho das imagens.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),2800)}
function nav(){for(const id of ['nav','bottom'])$('#'+id).innerHTML=navs[role].map(([k,i,t])=>'<button data-go="'+k+'" class="'+(tab===k?'active':'')+'" '+(tab===k?'aria-current="page"':'')+'><span class="navicon">'+i+'</span><span>'+t+'</span></button>').join('');$('#topLabel').textContent=role==='producer'?'Gestão da bancada':role==='company'?'Compras empresariais':'Descobrir produtos';$('#role').value=role}
const heading=(title,sub,action='')=>'<div class="heading"><div><h1>'+esc(title)+'</h1><div class="muted">'+esc(sub)+'</div></div>'+action+'</div>';
const btn=(label,action,id='',style='')=>'<button class="btn '+style+'" data-act="'+action+'" data-id="'+esc(id)+'">'+esc(label)+'</button>';
const go=(label,t)=>'<button class="textbtn" data-go="'+t+'">'+esc(label)+' →</button>';
const empty=(title,desc)=>'<div class="empty"><h3>'+esc(title)+'</h3><div class="muted">'+esc(desc)+'</div></div>';
const section=(title,body,action='')=>'<section class="section"><div class="sectionhead"><h2>'+esc(title)+'</h2>'+action+'</div>'+body+'</section>';
const metric=(label,value,detail)=>'<div class="metric"><div class="muted">'+esc(label)+'</div><div class="value">'+esc(value)+'</div><div class="muted">'+esc(detail)+'</div></div>';
const imageSafe=s=>typeof s==='string'&&/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
const photo=(p)=>imageSafe(p.photo)?'<img src="'+p.photo+'" alt="'+esc(p.name)+'">':esc(p.emoji||symbols[p.cat]||'🌱');
function productCard(p){const s=stallOf(p),fav=db.favorites.includes(p.id);return '<article class="card"><div class="photo">'+photo(p)+'<span class="pill">'+(p.demo?'Exemplo':p.offer?'Oferta':'Local')+'</span><button class="save" aria-label="'+(fav?'Remover dos favoritos':'Guardar favorito')+'" data-act="favorite" data-id="'+esc(p.id)+'">'+(fav?'♥':'♡')+'</button></div><div class="cardbody"><div class="muted">'+esc(p.cat)+' · '+esc(s.province)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.price)+' <small>/ '+esc(p.unit)+'</small></div><div class="muted">'+esc(s.name)+' · '+esc(p.stock)+' disponíveis</div><div class="actions">'+btn('Ver produto','product',p.id,'outline small')+'</div></div></article>'}
const productsGrid=ps=>'<div class="grid">'+(ps.length?ps.map(productCard).join(''):empty('Sem resultados','Altera a pesquisa ou os filtros.'))+'</div>';
function stallCard(s){return '<article class="card stall"><div class="stalltop"><div class="avatar">'+esc(s.emoji||'🌱')+'</div><div><h3>'+esc(s.name)+'</h3><div class="muted">📍 '+esc(s.city)+', '+esc(s.province)+'</div></div></div><p class="muted">'+esc(s.bio||'Bancada agrícola')+'</p><div class="muted">'+allProducts().filter(p=>p.stall===s.id).length+' produtos · '+(s.id==='mine'?'Local':'Exemplo')+'</div><div class="actions">'+btn('Visitar bancada','stall',s.id,'outline small')+'</div></article>'}
function filterProducts(){const tokens=norm(query).split(/\s+/).filter(Boolean),match=allProducts().filter(p=>{const s=stallOf(p),hay=norm([p.name,p.cat,s.name,s.province,s.city,p.desc].join(' '));return (!tokens.length||tokens.every(t=>hay.includes(t)))&&(category==='Todos'||p.cat===category)&&(!province||s.province===province)&&(!onlyOffers||p.offer)&&(!onlySaved||db.favorites.includes(p.id))});return match.sort((a,b)=>sort==='low'?a.price-b.price:sort==='high'?b.price-a.price:sort==='stock'?b.stock-a.stock:((b.offer?4:0)+(stallOf(b).province===db.province?3:0)+(db.searches.some(t=>norm(b.name).includes(t))?2:0))-((a.offer?4:0)+(stallOf(a).province===db.province?3:0)+(db.searches.some(t=>norm(a.name).includes(t))?2:0)))}
function searchBox(){return '<form class="search" id="searchForm"><input id="query" value="'+esc(query)+'" aria-label="Pesquisar produtos" placeholder="Ex.: milho Huíla, tomate Lubango"><button class="btn" type="submit">Pesquisar</button></form>'}
function market(){return heading(role==='company'?'Compras agrícolas':'Explorar mercado','Pesquisa por produto, região ou bancada.')+searchBox()+'<div class="chips">'+cats.map(c=>'<button class="chip '+(c===category?'active':'')+'" data-act="cat" data-id="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div class="formrow"><label class="field">Província<select id="filterProvince"><option value="">Todas</option>'+provinces.map(p=>'<option '+(p===province?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label><label class="field">Ordenar<select id="sort"><option value="recommended">Relevância</option><option value="low">Menor preço</option><option value="high">Maior preço</option><option value="stock">Maior stock</option></select></label></div><div class="chips"><button class="chip '+(onlyOffers?'active':'')+'" data-act="offers">Ofertas</button><button class="chip '+(onlySaved?'active':'')+'" data-act="saved">Favoritos</button></div><p class="muted">'+filterProducts().length+' resultados · pesquisa por palavras-chave e localização (sem IA externa)</p>'+productsGrid(filterProducts())}
function buyerHome(){const recommended=filterProducts().slice(0,6);return heading('Olá, boas compras!','O mercado do campo na tua mão.')+'<div class="hero"><div><span class="pill">🌿 Da produção à tua mesa</span><h2>Fresco, local e perto de ti.</h2><p>Descobre bancadas, compara preços e contacta quem produz.</p>'+btn('Explorar produtos','explore','','light')+'</div><div class="hero-art">🧺</div></div>'+searchBox()+section('Ofertas especiais',productsGrid(allProducts().filter(p=>p.offer).slice(0,3)),go('Ver mercado','market'))+section('Recomendados para ti',productsGrid(recommended),go('Explorar','market'))+section('Bancadas em destaque','<div class="grid">'+allStalls().slice(0,3).map(stallCard).join('')+'</div>',go('Todas','stalls'))}
function producerHome(){const own=db.products,orders=db.orders.filter(o=>o.stall==='mine'),views=own.reduce((sum,p)=>sum+(db.views[p.id]||0),0),delivered=orders.filter(o=>o.stage===4);return heading('Painel do produtor','Controla a tua bancada, stock e pedidos.',btn('+ Produto','add'))+'<div class="metrics">'+metric('Anúncios',own.length,'Criados neste dispositivo')+metric('Visualizações',views,'Aberturas locais')+metric('Pedidos',orders.length,'Pedidos da minha bancada')+metric('Total entregue',money(delivered.reduce((s,o)=>s+o.total,0)),'Valor demonstrativo')+'</div>'+section('A minha operação','<div class="split"><div class="panel"><h3>📦 Stock disponível</h3><p class="muted">Unidades anunciadas</p><div class="price">'+own.reduce((s,p)=>s+p.stock,0)+'</div>'+btn('Gerir catálogo','catalog','','outline')+'</div><div class="panel"><h3>📣 Expor e promover</h3><p class="muted">Prepara campanhas de divulgação para Facebook e Instagram.</p>'+btn('Promoções','promote','','outline')+'</div></div>')+section('Pedidos recentes',orderList(orders.slice(0,3),true),go('Todos','orders'))+section('Os meus produtos',productsGrid(own.slice(0,3)),go('Catálogo','catalog'))}
function companyHome(){const orders=db.orders.filter(o=>o.role==='company'),quotes=db.quotes;return heading('Central de compras','Planeia abastecimento e encontra fornecedores.',btn('+ Cotação','quote'))+'<div class="metrics">'+metric('Pedidos',orders.length,'Registos locais')+metric('Cotações',quotes.length,'Solicitações criadas')+metric('Fornecedores',new Set(orders.map(o=>o.stall)).size,'Bancadas com pedidos')+metric('Valor solicitado',money(orders.reduce((s,o)=>s+o.total,0)),'Não representa pagamento')+'</div>'+section('Compras a grosso','<div class="hero"><div><h2>Encontra stock para o teu negócio.</h2><p>Pesquisa por capacidade, preço e localização. Prepara pedidos de cotação.</p>'+btn('Pesquisar fornecedores','explore','','light')+'</div><div class="hero-art">🚚</div></div>')+section('Produtos com maior stock',productsGrid(allProducts().sort((a,b)=>b.stock-a.stock).slice(0,3)),go('Compras','market'))+section('Pedidos recentes',orderList(orders.slice(0,3),false),go('Todos','orders'))}
function orderList(items,producer){return items.length?items.map(o=>'<article class="panel"><div class="line"><div><strong>'+esc(o.name)+'</strong><p class="muted">#'+esc(o.id.slice(-6).toUpperCase())+' · '+esc(o.qty)+' '+esc(o.unit)+' · '+money(o.total)+'</p></div><span class="status">'+stages[o.stage]+'</span></div><div class="timeline">'+stages.map((s,i)=>'<div class="step '+(i<=o.stage?'on':'')+'"><i></i><span>'+esc(s)+'</span></div>').join('')+'</div><div class="muted">'+(o.demo?'Pedido de exemplo · ':'')+'Estado registado neste dispositivo; não é GPS.</div><div class="actions">'+(producer&&o.stage<4?btn('Avançar estado','advance',o.id,'small'):'')+btn('Detalhes','order',o.id,'outline small')+'</div></article>').join(''):empty('Ainda não há pedidos','Os pedidos criados neste protótipo aparecem aqui.')}
function catalog(){return heading('O meu catálogo','Publica e gere produtos da tua bancada.',btn('+ Produto','add'))+(db.products.length?db.products.map(p=>'<div class="panel"><div class="line"><div><strong>'+esc(p.name)+'</strong><p class="muted">'+money(p.price)+' / '+esc(p.unit)+' · Stock: '+esc(p.stock)+'</p></div><span class="status">'+(p.offer?'Oferta':'Publicado localmente')+'</span></div><div class="actions">'+btn('Editar','edit',p.id,'outline small')+btn('Ver','product',p.id,'outline small')+btn('Eliminar','delete',p.id,'danger small')+'</div></div>').join(''):empty('A tua bancada ainda está vazia','Adiciona o primeiro produto com fotografia, preço e stock.'))}
function promotions(){return heading('Promoções e exposição','Modelo de negócio: taxa de exposição e divulgação.')+'<div class="panel"><span class="pill">MODELO PROPOSTO</span><h3 style="margin-top:12px">Exposição na ZUNGA</h3><p class="muted">O produtor paga uma taxa de exposição, a definir, para promover a bancada ou produtos. O orçamento de publicidade Meta é separado e depende da campanha.</p>'+btn('Preparar campanha','campaign','','')+'</div><div class="panel"><h3>Facebook e Instagram</h3><p class="muted">Gera um endereço direto para a bancada com parâmetros UTM e copia-o para utilizar no Gestor de Anúncios da Meta. Nenhum anúncio será comprado automaticamente.</p>'+btn('Copiar link da bancada','copyStall','','outline')+'</div>'+section('Campanhas locais',db.campaigns.length?db.campaigns.map(c=>'<div class="panel"><div class="line"><div><strong>'+esc(c.name)+'</strong><p class="muted">'+esc(c.target)+' · Orçamento pretendido: '+money(c.budget)+'</p></div><span class="status">Rascunho</span></div>'+btn('Copiar link','copyCampaign',c.id,'outline small')+'</div>').join(''):empty('Nenhuma campanha','Cria um rascunho sem gastar dinheiro.'))}
function quoteList(){return heading('Pedidos de cotação','Planeia compras de maior volume.',btn('+ Cotação','quote'))+(db.quotes.length?db.quotes.map(q=>'<div class="panel"><div class="line"><div><strong>'+esc(q.name)+'</strong><p class="muted">'+esc(q.qty)+' '+esc(q.unit)+' · '+esc(q.province)+'</p><p class="muted">'+esc(q.note)+'</p></div><span class="status">Rascunho local</span></div></div>').join(''):empty('Nenhuma cotação','Cria uma solicitação com o produto, quantidade e destino.'))}
function profile(){return heading(role==='producer'?'A minha bancada':role==='company'?'Perfil empresarial':'O meu perfil','Preferências e dados guardados neste dispositivo.')+(role==='producer'?'<div class="panel"><h3>'+esc(db.stall.name)+'</h3><p class="muted">📍 '+esc(db.stall.city)+', '+esc(db.stall.province)+'</p><p class="muted">'+esc(db.stall.bio||'Adiciona uma descrição da tua produção.')+'</p><div class="actions">'+btn('Editar bancada','editStall','','outline')+btn('Ver bancada','stall','mine')+'</div></div>':'<div class="panel"><h3>Localização preferida</h3><label class="field">Província<select id="preference"><option value="">Não definida</option>'+provinces.map(p=>'<option '+(db.province===p?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label><p class="muted">Utilizada nas recomendações do catálogo.</p></div>')+'<div class="panel"><h3>Ambiente de demonstração</h3><p class="muted">A troca de perfil serve para testar as interfaces. Não representa autenticação, permissões reais, verificação de empresas ou comunicação entre dispositivos.</p>'+btn('Limpar dados locais','reset','','danger small')+'</div>'}
function render(){nav();let body='';if(tab==='home')body=role==='buyer'?buyerHome():role==='producer'?producerHome():companyHome();else if(tab==='market')body=market();else if(tab==='stalls')body=heading('Bancadas digitais','Conhece os produtores e os seus catálogos.')+'<div class="grid">'+allStalls().map(stallCard).join('')+'</div>';else if(tab==='orders')body=heading(role==='producer'?'Pedidos recebidos':'Os meus pedidos','Acompanhamento por estados demonstrativos.')+orderList(db.orders.filter(o=>role==='producer'?o.stall==='mine':o.role===role),role==='producer');else if(tab==='catalog')body=catalog();else if(tab==='promote')body=promotions();else if(tab==='quotes')body=quoteList();else body=profile();$('#view').innerHTML='<div class="notice">PROTÓTIPO V2 · Dados de exemplo e registos locais. Sem contas reais, pagamentos ou pedidos enviados pela internet.</div>'+body;if($('#sort'))$('#sort').value=sort}
function navigate(t){if(!navs[role].some(n=>n[0]===t))t='home';tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
function show(title,body){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}
function close(){if($('#dialog').open)$('#dialog').close()}
const options=(arr,val)=>arr.map(s=>'<option '+(s===val?'selected':'')+'>'+esc(s)+'</option>').join('');
const input=(label,name,value='',attrs='')=>'<label class="field">'+esc(label)+'<input name="'+name+'" value="'+esc(value)+'" '+attrs+'></label>';
const select=(label,name,arr,val)=>'<label class="field">'+esc(label)+'<select name="'+name+'">'+options(arr,val)+'</select></label>';
const submit=label=>'<button class="btn" type="submit">'+esc(label)+'</button>';
function detail(id){const p=productOf(id);if(!p)return;const s=stallOf(p);db.views[id]=(db.views[id]||0)+1;save();const phone=String(s.phone||'').replace(/\D/g,'');const contact=/^(?:244)?9\d{8}$/.test(phone)?'<a class="btn outline" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+(phone.startsWith('244')?phone:'244'+phone)+'?text='+encodeURIComponent('Olá! Vi '+p.name+' na ZUNGA.')+'">WhatsApp</a>':'';show(p.name,'<div class="photo" style="border-radius:14px;margin:15px 0">'+photo(p)+'</div><div class="price">'+money(p.price)+' / '+esc(p.unit)+'</div><p class="muted">'+esc(p.desc||'Produto agrícola')+' · '+esc(p.stock)+' disponíveis</p><p>📍 '+esc(s.city)+', '+esc(s.province)+'</p>'+btn('Visitar '+s.name,'stall',s.id,'outline small')+(role!=='producer'?'<form id="orderForm" data-id="'+esc(id)+'">'+input('Quantidade','qty',1,'type="number" min="1" max="'+Number(p.stock)+'" required')+'<p class="muted">Cria apenas um pedido local de teste. Não será enviado ao vendedor.</p>'+submit('Criar pedido demo')+'</form>':'')+'<div class="actions">'+contact+btn('Copiar link do produto','copyProduct',id,'outline small')+'</div>')}
function showStall(id){const s=allStalls().find(x=>x.id===id);if(!s)return;activeStall=id;show(s.name,'<div class="hero" style="margin:14px 0"><div><span class="pill">'+(id==='mine'?'Bancada local':'Bancada de exemplo')+'</span><h2>'+esc(s.name)+'</h2><p>'+esc(s.bio||'Bancada agrícola')+'</p></div><div class="hero-art">'+esc(s.emoji||'🌱')+'</div></div><p>📍 '+esc(s.city)+', '+esc(s.province)+'</p><h3>Catálogo da bancada</h3>'+productsGrid(allProducts().filter(p=>p.stall===id))+ '<div class="actions">'+btn('Partilhar bancada','copyStall',id,'outline small')+'</div>')}
function productForm(id){const p=db.products.find(x=>x.id===id)||{};show(id?'Editar produto':'Novo produto','<form id="productForm" data-id="'+esc(id||'')+'">'+input('Nome do produto','name',p.name,'required maxlength="70"')+select('Categoria','cat',cats.slice(1),p.cat)+'<div class="formrow">'+input('Preço em Kz','price',p.price,'type="number" min="1" max="1000000000" required')+select('Unidade','unit',['kg','saco','caixa','tonelada','unidade'],p.unit)+'</div>'+input('Stock disponível','stock',p.stock??1,'type="number" min="1" max="1000000" required')+'<label class="field">Descrição<textarea name="desc" maxlength="400" rows="3">'+esc(p.desc||'')+'</textarea></label><label class="field">Fotografia (JPG, PNG ou WebP, até 2 MB)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="checkbox"><input name="offer" type="checkbox" '+(p.offer?'checked':'')+'> Marcar como oferta especial</label><p class="muted">Publicação local, sem cobrança neste protótipo.</p>'+submit('Guardar produto')+'</form>')}
function stallForm(){const s=db.stall;show('Editar bancada','<form id="stallForm">'+input('Nome da bancada','name',s.name,'required maxlength="70"')+select('Província','province',provinces,s.province)+input('Município','city',s.city,'required maxlength="60"')+input('WhatsApp (opcional)','phone',s.phone,'type="tel" maxlength="16" placeholder="923456789"')+'<label class="field">Descrição<textarea name="bio" rows="3" maxlength="400">'+esc(s.bio)+'</textarea></label>'+submit('Guardar bancada')+'</form>')}
function quoteForm(){show('Nova cotação','<form id="quoteForm">'+input('Produto pretendido','name','','required maxlength="70"')+'<div class="formrow">'+input('Quantidade','qty',1,'type="number" min="1" required')+select('Unidade','unit',['kg','saco','caixa','tonelada','unidade'])+'</div>'+select('Província de destino','province',provinces,db.province||'Huíla')+'<label class="field">Condições e prazo<textarea name="note" rows="3" maxlength="400"></textarea></label><p class="muted">A cotação é um rascunho local, ainda não é enviada.</p>'+submit('Guardar cotação')+'</form>')}
function campaignForm(){show('Preparar campanha','<form id="campaignForm">'+input('Nome da campanha','name','','required maxlength="80"')+select('Destino','target',['Bancada','Produto'])+'<label class="field">Produto (se destino for produto)<select name="product"><option value="">Escolher produto</option>'+db.products.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select></label>'+input('Orçamento de publicidade pretendido (Kz)','budget',0,'type="number" min="0" required')+'<p class="muted">Não é uma cobrança. O pagamento da taxa de exposição e a compra de publicidade Meta ainda não estão integrados.</p>'+submit('Guardar rascunho')+'</form>')}
function orderDetail(id){const o=db.orders.find(x=>x.id===id);if(!o)return;show('Pedido #'+o.id.slice(-6).toUpperCase(),'<div class="panel"><h3>'+esc(o.name)+'</h3><p>'+esc(o.qty)+' '+esc(o.unit)+' · '+money(o.total)+'</p><p>Estado: '+stages[o.stage]+'</p><p class="muted">Criado em '+esc(new Date(o.date).toLocaleString('pt-AO'))+' · Simulação local, sem confirmação de fornecedor nem localização GPS.</p></div>')}
function linkFor(type,id,campaign=false){const u=new URL(location.origin+location.pathname);u.searchParams.set(type,id);if(campaign){u.searchParams.set('utm_source','meta');u.searchParams.set('utm_medium','paid_social');u.searchParams.set('utm_campaign','zunga_exposicao')}return u.toString()}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Link copiado. Anúncios locais não são visíveis noutros dispositivos.')}catch{show('Copiar endereço','<label class="field">Link<input readonly value="'+esc(s)+'"></label><p class="muted">Seleciona o endereço e copia manualmente.</p>')}}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function readPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve('');if(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('Escolhe uma imagem JPG, PNG ou WebP até 2 MB.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act]');if(!b)return;if(b.dataset.go){close();navigate(b.dataset.go);return}const id=b.dataset.id||'';switch(b.dataset.act){case 'explore':close();navigate('market');break;case 'catalog':navigate('catalog');break;case 'promote':navigate('promote');break;case 'product':detail(id);break;case 'stall':showStall(id);break;case 'favorite':db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id];save();if($('#dialog').open&&activeStall)showStall(activeStall);else render();toast('Favoritos atualizados');break;case 'cat':category=id;render();break;case 'offers':onlyOffers=!onlyOffers;render();break;case 'saved':onlySaved=!onlySaved;render();break;case 'add':case 'edit':productForm(id);break;case 'delete':if(confirm('Eliminar este produto local?')){db.products=db.products.filter(p=>p.id!==id);save();render()}break;case 'editStall':stallForm();break;case 'quote':quoteForm();break;case 'campaign':campaignForm();break;case 'advance':{const o=db.orders.find(x=>x.id===id&&x.stall==='mine');if(o&&o.stage<4){o.stage++;save();render();toast('Estado local atualizado')}break}case 'order':orderDetail(id);break;case 'copyStall':copy(linkFor('stall',id||'mine',true));break;case 'copyProduct':copy(linkFor('product',id,true));break;case 'copyCampaign':{const c=db.campaigns.find(x=>x.id===id);if(c)copy(linkFor(c.target==='Produto'?'product':'stall',c.target==='Produto'?c.product:'mine',true));break}case 'reset':if(confirm('Eliminar todos os dados da ZUNGA V2 neste navegador?')){localStorage.removeItem(key);location.href=location.pathname}break}});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;db.role=role;save();close();query='';category='Todos';province='';onlyOffers=false;onlySaved=false;sort='recommended';navigate('home')}else if(e.target.id==='filterProvince'){province=e.target.value;render()}else if(e.target.id==='sort'){sort=e.target.value;render()}else if(e.target.id==='preference'){db.province=e.target.value;save();toast('Preferência guardada')}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['searchForm','productForm','stallForm','orderForm','quoteForm','campaignForm'].includes(f.id))return;e.preventDefault();const v=formData(f);if(f.id==='searchForm'){query=$('#query').value.trim();db.searches=[...new Set([...db.searches,...norm(query).split(/\s+/).filter(Boolean)])].slice(-20);save();navigate('market');return}if(f.id==='productForm'){const id=f.dataset.id||uid(),old=db.products.find(p=>p.id===id);let photo;try{photo=await readPhoto(v.photo)}catch(err){toast(err.message);return}const p={id,stall:'mine',name:v.name.trim(),cat:v.cat,price:Number(v.price),unit:v.unit,stock:Number(v.stock),desc:v.desc.trim(),photo:photo||old?.photo||'',offer:!!v.offer,emoji:symbols[v.cat]};if(!p.name||p.price<=0||p.stock<1)return;const before=db.products;db.products=[p,...before.filter(x=>x.id!==id)];if(!save()){db.products=before;return}close();navigate('catalog');toast('Produto guardado localmente');return}if(f.id==='stallForm'){const phone=v.phone.replace(/\D/g,'');if(phone&&!/^(?:244)?9\d{8}$/.test(phone)){toast('Número angolano inválido');return}db.stall={...db.stall,name:v.name.trim(),province:v.province,city:v.city.trim(),phone,bio:v.bio.trim()}}else if(f.id==='orderForm'){const p=productOf(f.dataset.id),qty=Number(v.qty);if(!p||qty<1||qty>p.stock||role==='producer')return;db.orders.unshift({id:uid(),product:p.id,stall:p.stall,name:p.name,qty,unit:p.unit,total:qty*p.price,stage:0,role,date:Date.now(),demo:!!p.demo});if(!p.demo){p.stock-=qty;if(p.stock<0)p.stock=0}if(save()){close();navigate('orders');toast('Pedido de demonstração guardado')}return}else if(f.id==='quoteForm'){db.quotes.unshift({id:uid(),...v,name:v.name.trim(),qty:Number(v.qty)})}else if(f.id==='campaignForm'){if(v.target==='Produto'&&!v.product){toast('Seleciona um produto');return}db.campaigns.unshift({id:uid(),...v,name:v.name.trim(),budget:Number(v.budget)})}if(save()){close();render();toast('Guardado neste dispositivo')}});
$('#closeDialog').addEventListener('click',close);$('#dialog').addEventListener('close',()=>{activeStall=null});render();const params=new URLSearchParams(location.search);if(params.has('product')){if(productOf(params.get('product')))detail(params.get('product'));else toast('Produto indisponível neste dispositivo')}else if(params.has('stall')){if(params.get('stall')==='mine'&&!db.products.length)toast('Bancada local: o catálogo não é partilhado entre dispositivos');showStall(params.get('stall'))}
</script></body></html>
