function filterProducts(){const tokens=norm(query).split(/\s+/).filter(Boolean),match=allProducts().filter(p=>{const s=stallOf(p),hay=norm([p.name,p.cat,s.name,s.province,s.city,p.desc].join(' '));return (!tokens.length||tokens.every(t=>hay.includes(t)))&&(category==='Todos'||p.cat===category)&&(!province||s.province===province)&&(!onlyOffers||p.offer)&&(!onlySaved||db.favorites.includes(p.id))});return match.sort((a,b)=>sort==='low'?a.price-b.price:sort==='high'?b.price-a.price:sort==='stock'?b.stock-a.stock:((b.offer?4:0)+(stallOf(b).province===db.province?3:0)+(db.searches.some(t=>norm(b.name).includes(t))?2:0))-((a.offer?4:0)+(stallOf(a).province===db.province?3:0)+(db.searches.some(t=>norm(a.name).includes(t))?2:0)))}

function buyerHome(){const recommended=filterProducts().slice(0,6),orders=db.orders.filter(o=>o.role==='buyer');return heading('Olá, boas compras!','O mercado do campo na tua mão.')+'<div class="hero"><div><span class="pill">🌿 Da produção à tua mesa</span><h2>Fresco, local e perto de ti.</h2><p>Descobre bancadas, compara preços e contacta quem produz.</p>'+btn('Explorar produtos','explore','','light')+'</div><div class="hero-art">🧺</div></div>'+'<div class="section metrics">'+metric('Pedidos ativos',orders.filter(o=>o.stage<4).length,'Em acompanhamento')+metric('Favoritos',db.favorites.length,'Produtos guardados')+metric('Entregues',orders.filter(o=>o.stage===4).length,'Pedidos locais')+metric('Valor solicitado',money(orders.reduce((s,o)=>s+o.total,0)),'Sem pagamento')+'</div>'+searchBox()+section('Ofertas especiais',productsGrid(allProducts().filter(p=>p.offer).slice(0,3)),go('Ver mercado','market'))+section('Recomendados para ti',productsGrid(recommended),go('Explorar','market'))+section('Bancadas em destaque','<div class="grid">'+allStalls().slice(0,3).map(stallCard).join('')+'</div>',go('Todas','stalls'))}
function oldProducerHome(){const own=db.products,orders=db.orders.filter(o=>o.stall==='mine'),views=own.reduce((sum,p)=>sum+(db.views[p.id]||0),0),delivered=orders.filter(o=>o.stage===4);return heading('Painel do produtor','Controla a tua bancada, stock e pedidos.',btn('+ Produto','add'))+'<div class="metrics">'+metric('Anúncios',own.length,'Criados neste dispositivo')+metric('Visualizações',views,'Aberturas locais')+metric('Pedidos',orders.length,'Pedidos da minha bancada')+metric('Total entregue',money(delivered.reduce((s,o)=>s+o.total,0)),'Valor demonstrativo')+'</div>'+section('A minha operação','<div class="split"><div class="panel"><h3>📦 Stock disponível</h3><p class="muted">Unidades anunciadas</p><div class="price">'+own.reduce((s,p)=>s+p.stock,0)+'</div>'+btn('Gerir catálogo','catalog','','outline')+'</div><div class="panel"><h3>📣 Expor e promover</h3><p class="muted">Prepara campanhas de divulgação para Facebook e Instagram.</p>'+btn('Promoções','promote','','outline')+'</div></div>')+section('Pedidos recentes',orderList(orders.slice(0,3),true),go('Todos','orders'))+section('Os meus produtos',productsGrid(own.slice(0,3)),go('Catálogo','catalog'))}
function companyHome(){const orders=db.orders.filter(o=>o.role==='company'),quotes=db.quotes;return heading('Central de compras','Planeia abastecimento e encontra fornecedores.',btn('+ Cotação','quote'))+'<div class="metrics">'+metric('Pedidos',orders.length,'Registos locais')+metric('Cotações',quotes.length,'Solicitações criadas')+metric('Fornecedores',new Set(orders.map(o=>o.stall)).size,'Bancadas com pedidos')+metric('Valor solicitado',money(orders.reduce((s,o)=>s+o.total,0)),'Não representa pagamento')+'</div>'+section('Compras a grosso','<div class="hero"><div><h2>Encontra stock para o teu negócio.</h2><p>Pesquisa por capacidade, preço e localização. Prepara pedidos de cotação.</p>'+btn('Pesquisar fornecedores','explore','','light')+'</div><div class="hero-art">🚚</div></div>')+section('Produtos com maior stock',productsGrid(allProducts().sort((a,b)=>b.stock-a.stock).slice(0,3)),go('Compras','market'))+section('Pedidos recentes',orderList(orders.slice(0,3),false),go('Todos','orders'))}
function orderList(items,producer){return items.length?items.map(o=>'<article class="panel"><div class="line"><div><strong>'+esc(o.name)+'</strong><p class="muted">#'+esc(o.id.slice(-6).toUpperCase())+' · '+esc(o.qty)+' '+esc(o.unit)+' · '+money(o.total)+'</p></div><span class="status">'+stages[o.stage]+'</span></div><div class="timeline">'+stages.map((s,i)=>'<div class="step '+(i<=o.stage?'on':'')+'"><i></i><span>'+esc(s)+'</span></div>').join('')+'</div><div class="muted">'+(o.demo?'Pedido de exemplo · ':'')+'Estado registado neste dispositivo; não é GPS.</div><div class="actions">'+(producer&&o.stage<4?btn('Avançar estado','advance',o.id,'small'):'')+btn('Detalhes','order',o.id,'outline small')+'</div></article>').join(''):empty('Ainda não há pedidos','Os pedidos criados neste protótipo aparecem aqui.')}

function companyProfile(){const c=db.company;return '<div class="panel"><h3>Dados da organização</h3><form id="companyForm">'+input('Nome da empresa','name',c.name,'required maxlength="80"')+input('NIF (opcional)','nif',c.nif,'maxlength="25"')+input('Contacto','contact',c.contact,'maxlength="50"')+input('Setor de atividade','sector',c.sector,'maxlength="80"')+submit('Guardar empresa')+'</form><p class="muted">Dados locais, sem validação empresarial.</p></div>'}function profile(){return heading(role==='producer'?'A minha bancada':role==='company'?'Perfil empresarial':'O meu perfil','Preferências e dados guardados neste dispositivo.')+(role==='producer'?'<div class="panel"><h3>'+esc(db.stall.name)+'</h3><p class="muted">📍 '+esc(db.stall.city)+', '+esc(db.stall.province)+'</p><p class="muted">'+esc(db.stall.bio||'Adiciona uma descrição da tua produção.')+'</p><div class="actions">'+btn('Editar bancada','editStall','','outline')+btn('Ver bancada','stall','mine')+'</div></div>':'<div class="panel"><h3>Localização preferida</h3><label class="field">Província<select id="preference"><option value="">Não definida</option>'+provinces.map(p=>'<option '+(db.province===p?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label><p class="muted">Utilizada nas recomendações do catálogo.</p></div>')+(role==='company'?companyProfile():'')+'<div class="panel"><h3>Ambiente de demonstração</h3><p class="muted">A troca de perfil serve para testar as interfaces. Não representa autenticação, permissões reais, verificação de empresas ou comunicação entre dispositivos.</p>'+btn('Limpar dados locais','reset','','danger small')+'</div>'}

function linkFor(type,id,campaign=false){const u=new URL(location.origin+location.pathname);u.searchParams.set(type,id);if(campaign){u.searchParams.set('utm_source','meta');u.searchParams.set('utm_medium','paid_social');u.searchParams.set('utm_campaign','zunga_exposicao')}return u.toString()}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Link copiado. Anúncios locais não são visíveis noutros dispositivos.')}catch{show('Copiar endereço','<label class="field">Link<input readonly value="'+esc(s)+'"></label><p class="muted">Seleciona o endereço e copia manualmente.</p>')}}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function readPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve('');if(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('Escolhe uma imagem JPG, PNG ou WebP até 2 MB.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act]');if(!b)return;if(b.dataset.go){close();navigate(b.dataset.go);return}const id=b.dataset.id||'';switch(b.dataset.act){case 'explore':close();navigate('market');break;case 'catalog':navigate('catalog');break;case 'promote':navigate('promote');break;case 'product':detail(id);break;case 'stall':showStall(id);break;case 'favorite':db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id];save();if($('#dialog').open&&activeStall)showStall(activeStall);else render();toast('Favoritos atualizados');break;case 'cat':category=id;render();break;case 'offers':onlyOffers=!onlyOffers;render();break;case 'saved':onlySaved=!onlySaved;render();break;case 'add':case 'edit':productForm(id);break;case 'delete':if(confirm('Eliminar este produto local?')){db.products=db.products.filter(p=>p.id!==id);save();render()}break;case 'editStall':stallForm();break;case 'quote':quoteForm();break;case 'campaign':campaignForm();break;case 'advance':{const o=db.orders.find(x=>x.id===id&&x.stall==='mine');if(o&&o.stage<4){o.stage++;save();render();toast('Estado local atualizado')}break}case 'order':orderDetail(id);break;case 'copyStall':copy(linkFor('stall',id||'mine',true));break;case 'copyProduct':copy(linkFor('product',id,true));break;case 'copyCampaign':{const c=db.campaigns.find(x=>x.id===id);if(c)copy(linkFor(c.target==='Produto'?'product':'stall',c.target==='Produto'?c.product:'mine',true));break}case 'reset':if(confirm('Eliminar todos os dados da ZUNGA V2 neste navegador?')){localStorage.removeItem(key);localStorage.removeItem('zunga-customer-v3');localStorage.removeItem('zunga-producer-v4');localStorage.removeItem('zunga-shopping-v5');location.href=location.pathname}break}});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;db.role=role;save();close();query='';category='Todos';province='';onlyOffers=false;onlySaved=false;sort='recommended';navigate('home');if(role==='buyer'&&!account.signed&&!account.guest)openAuth();else if(role==='producer'&&!producerAccount.signed)openProducerAuth()}else if(e.target.id==='filterProvince'){province=e.target.value;render()}else if(e.target.id==='sort'){sort=e.target.value;render()}else if(e.target.id==='preference'){db.province=e.target.value;save();toast('Preferência guardada')}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['searchForm','productForm','stallForm','orderForm','quoteForm','campaignForm','companyForm'].includes(f.id))return;e.preventDefault();const v=formData(f);if(f.id==='searchForm'){query=$('#query').value.trim();db.searches=[...new Set([...db.searches,...norm(query).split(/\s+/).filter(Boolean)])].slice(-20);save();navigate('market');return}if(f.id==='productForm'){const id=f.dataset.id||uid(),old=db.products.find(p=>p.id===id);let photo;try{photo=await readPhoto(v.photo)}catch(err){toast(err.message);return}const p={id,stall:'mine',name:v.name.trim(),cat:v.cat,price:Number(v.price),unit:v.unit,stock:Number(v.stock),desc:v.desc.trim(),photo:photo||old?.photo||'',offer:!!v.offer,emoji:symbols[v.cat],active:v.active==='yes',minimum:Number(v.minimum)||1,harvest:v.harvest||'',updated:Date.now()};if(!p.name||!Number.isFinite(p.price)||p.price<=0||!Number.isInteger(p.stock)||p.stock<0||p.minimum<1){toast('Confirma preço, stock e quantidade mínima');return;}const before=db.products;db.products=[p,...before.filter(x=>x.id!==id)];if(!save()){db.products=before;return}close();navigate('catalog');toast('Produto guardado localmente');return}if(f.id==='stallForm'){const phone=v.phone.replace(/\D/g,'');if(phone&&!/^(?:244)?9\d{8}$/.test(phone)){toast('Número angolano inválido');return}let photo,cover;try{photo=await readPhoto(v.photo);cover=await readPhoto(v.cover)}catch(err){toast(err.message);return}const previous=db.stall;db.stall={...db.stall,name:v.name.trim(),province:v.province,city:v.city.trim(),phone,bio:v.bio.trim(),photo:photo||db.stall.photo||'',cover:cover||db.stall.cover||'',address:v.address.trim(),hours:v.hours.trim(),delivery:v.delivery,kind:v.kind};if(!save()){db.stall=previous;toast('Espaço local insuficiente. Experimenta imagens menores.');return}close();navigate('profile');toast('Bancada atualizada');return}else if(f.id==='orderForm'){const p=productOf(f.dataset.id),qty=Number(v.qty);if(!p||!Number.isInteger(qty)||qty<(p.minimum||1)||qty>p.stock||role==='producer'){toast('Quantidade fora do stock ou do mínimo anunciado');return;}const previousStock=p.stock;db.orders.unshift({id:uid(),product:p.id,stall:p.stall,name:p.name,qty,unit:p.unit,total:qty*p.price,stage:0,role,date:Date.now(),demo:!!p.demo});if(!p.demo){p.stock-=qty;if(p.stock<0)p.stock=0}if(save()){close();navigate('orders');toast('Pedido de demonstração guardado')}else{db.orders.shift();p.stock=previousStock}return}else if(f.id==='quoteForm'){db.quotes.unshift({id:uid(),...v,name:v.name.trim(),qty:Number(v.qty)})}else if(f.id==='companyForm'){db.company={name:v.name.trim(),nif:v.nif.trim(),contact:v.contact.trim(),sector:v.sector.trim()}}else if(f.id==='campaignForm'){if(v.target==='Produto'&&!v.product){toast('Seleciona um produto');return}db.campaigns.unshift({id:uid(),...v,name:v.name.trim(),budget:Number(v.budget)})}if(save()){close();render();toast('Guardado neste dispositivo')}});

if(regStep===1)body+=input('Nome completo','name',registration.name||'','required maxlength="80" placeholder="Ex.: Maria Demo"')+input('Email fictício','email',registration.email||'','type="email" required placeholder="maria@zunga.test"')+input('Telefone fictício (opcional)','phone',registration.phone||'','type="tel" maxlength="16"')+input('Palavra-passe demo','password','','type="password" autocomplete="off" required placeholder="ZungaDemo123!"')+input('Confirmar palavra-passe','confirm','','type="password" autocomplete="off" required')+'<p class="muted">Utiliza '+demoPassword+' para este teste.</p>';

else body+='<p>Escolhe as categorias que mais te interessam.</p><div class="interestgrid">'+cats.slice(1).map(c=>'<label class="interest">'+photoTag(photoFiles[categoriesPhoto[c]],c,160)+'<span>'+esc(c)+'</span><input type="checkbox" name="interests" value="'+esc(c)+'" '+((registration.interests||[]).includes(c)?'checked':'')+'></label>').join('')+'</div>';
body+='<div class="err" id="authError" role="alert"></div>'+submit(regStep===3?'Concluir registo':'Continuar')+'</form>'+authButton(regStep===1?'Voltar':'Passo anterior','regBack','outline')}else if(authPage==='done'){title='Tudo pronto, '+(account.name.split(' ')[0]||'cliente')+'!';body='<p>A tua experiência está personalizada. Vamos conhecer o mercado?</p>'+authButton('Começar a explorar','finish')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(!b)return;const act=b.dataset.auth;if(act==='intro'){introStep=0;authPage='intro'}else if(act==='nextIntro'){if(++introStep>=slides.length){regStep=1;authPage='register'}}else if(act==='register'){regStep=1;editingPrefs=false;registration={};authPage='register'}else if(act==='regBack'){if(editingPrefs&&regStep===2){editingPrefs=false;hideAuth();return}if(regStep>1)regStep--;else authPage='welcome'}else if(act==='quick'){loginDemo('demo@zunga.test',demoPassword);return}else if(act==='guest'){enterCustomer(true);return}else if(act==='finish'){enterCustomer();return}else if(act==='login'||act==='recover'){authPage=act}else if(act==='logout'){account.signed=false;account.guest=false;saveAccount();openAuth('welcome');return}else if(act==='tutorial'){startCoach();return}else if(act==='editPrefs'){regStep=2;editingPrefs=true;registration={...account};authPage='register';openAuth('register');return}renderAuth()});

function addressForm(id=''){const a=shop.addresses.find(x=>x.id===id)||{};show('Endereço de entrega','<form id="shopAddressForm" data-id="'+esc(id)+'">'+input('Nome do endereço','label',a.label||'Casa','required maxlength="40"')+select('Província','province',provinces,a.province||account.province||'Huíla')+input('Município','city',a.city||account.city||'','required maxlength="60"')+input('Bairro / rua / referência','street',a.street||'','required maxlength="120"')+'<p class="muted">Usa dados fictícios durante a demonstração.</p>'+submit('Guardar endereço')+'</form>')}

function checkoutPage(){if(!cartValid())return cartPage();const a=address();return '<button class="textbtn" data-go="cart">← Voltar ao carrinho</button>'+heading('Finalizar compra','Revê as informações antes de criar o pedido demo.')+'<form id="shopCheckout"><div class="panel"><h3>Receber os produtos</h3><label class="checkoutchoice"><input name="mode" type="radio" value="pickup" '+(shop.mode==='pickup'?'checked':'')+'> Levantamento na bancada</label><label class="checkoutchoice"><input name="mode" type="radio" value="delivery" '+(shop.mode==='delivery'?'checked':'')+'> Solicitar entrega (a combinar)</label><p class="muted">Não temos transportadores nem preços de entrega ativos.</p><div id="checkoutAddress">'+(a?'<p>'+esc(a.label)+' · '+esc(a.street)+', '+esc(a.city)+'</p>':'<p class="muted">Nenhum endereço guardado.</p>')+'<button type="button" class="btn outline" data-act="shopAddresses">Escolher endereço</button></div>'+select('Preferência de horário','slot',['A combinar','Manhã','Tarde'],shop.slot)+'</div><div class="panel"><h3>Cupão de demonstração</h3><label class="field">Código<input name="coupon" value="'+esc(shop.coupon)+'" placeholder="ZUNGADEMO"></label><button class="btn outline" type="button" data-shop="applyCoupon">Aplicar</button><p class="muted">Código de teste ZUNGADEMO: 5% sobre os produtos. Não é desconto comercial real.</p></div><div class="cartsummary"><h3>Resumo</h3><div class="line"><span>Produtos</span><strong>'+money(cartSubtotal())+'</strong></div><div class="line"><span>Desconto demo</span><strong>− '+money(discount())+'</strong></div><div class="line"><span>Entrega</span><span>A combinar</span></div><div class="line"><strong>Total dos produtos</strong><strong>'+money(cartSubtotal()-discount())+'</strong></div><p class="shopalert">Sem pagamento real. O pedido é guardado apenas neste navegador, separado por bancada e sem envio ao fornecedor.</p>'+submit('Confirmar pedido demo')+'</div></form>'}
function placeCart(v){if(!cartValid())return false;if(!['pickup','delivery'].includes(v.mode)||!['A combinar','Manhã','Tarde'].includes(v.slot))return false;if(v.mode==='delivery'&&!address()){toast('Escolhe um endereço de entrega');return false}const rows=cartRows(),group=uid(),total=cartSubtotal(),disc=discount();const oldOrders=db.orders.slice(),oldCart={...shop.cart},oldCoupon=shop.coupon,oldMode=shop.mode,oldSlot=shop.slot,stocks=rows.map(r=>[r.p,r.p.stock]);let allocated=0;rows.forEach((r,i)=>{const lineTotal=r.qty*r.p.price,d=i===rows.length-1?disc-allocated:Math.floor(disc*lineTotal/total);allocated+=d;db.orders.unshift({id:uid(),group,product:r.id,stall:r.p.stall,name:r.p.name,qty:r.qty,unit:r.p.unit,total:lineTotal-d,stage:0,role:'buyer',date:Date.now(),demo:true,mode:v.mode,slot:v.slot,address:v.mode==='delivery'?{...address()}:null});if(!r.p.demo)r.p.stock-=r.qty});if(!save()){db.orders=oldOrders;stocks.forEach(([p,n])=>p.stock=n);return false}shop.cart={};shop.coupon='';shop.mode=v.mode;shop.slot=v.slot;if(!saveShop()){db.orders=oldOrders;stocks.forEach(([p,n])=>p.stock=n);shop.cart=oldCart;shop.coupon=oldCoupon;shop.mode=oldMode;shop.slot=oldSlot;save();return false}return true}
function customerOrders(){const all=db.orders.filter(o=>o.role==='buyer'),items=all.filter(o=>orderFilter==='all'||(orderFilter==='active'?o.stage<4:o.stage===4));return heading('Os meus pedidos','Consulta o estado e o histórico das tuas compras.')+'<div class="chips">'+[['active','Em curso'],['history','Concluídos'],['all','Todos']].map(([k,t])=>'<button class="chip '+(orderFilter===k?'active':'')+'" data-shop="orderFilter" data-id="'+k+'">'+t+'</button>').join('')+'</div>'+(items.length?items.map(o=>'<article class="panel shoporder">'+orderList([o],false)+'<p class="muted">'+esc(o.mode==='delivery'?'Entrega a combinar':'Levantamento / a combinar')+(o.slot?' · '+esc(o.slot):'')+'</p><div class="actions"><button class="btn outline small" data-shop="reorder" data-id="'+esc(o.id)+'">Comprar novamente</button><button class="btn outline small" data-shop="support" data-id="'+esc(o.id)+'">Pedir ajuda</button></div></article>').join(''):empty('Sem pedidos nesta vista','As compras confirmadas aparecerão aqui.'))}
function supportForm(id=''){const o=db.orders.find(x=>x.id===id&&x.role==='buyer');show('Central de ajuda','<form id="shopSupport" data-id="'+esc(o?.id||'')+'">'+(o?'<p class="muted">Pedido #'+esc(o.id.slice(-6).toUpperCase())+' · '+esc(o.name)+'</p>':'')+select('Motivo','kind',['Produto com problema','Pedido em atraso','Solicitar substituição','Solicitar reembolso','Outra questão'])+'<label class="field">Descreve a situação<textarea name="note" required rows="4" maxlength="500"></textarea></label><p class="muted">O pedido de apoio é um registo local, não é enviado e não gera reembolso.</p>'+submit('Guardar solicitação demo')+'</form>')}
function customerProfile(){const name=account.name||'Visitante';return heading('A minha conta','Gere os teus dados e preferências.')+'<div class="panel"><div class="accounthead"><div class="accountavatar">'+esc(name.slice(0,1).toUpperCase())+'</div><div><h3>'+esc(name)+'</h3><div class="muted">'+esc(account.email||'Sem conta')+'</div></div></div></div><div class="panel shoplinks"><button class="line" data-go="orders">Os meus pedidos <span>›</span></button><button class="line" data-shop="favorites">Favoritos <span>›</span></button><button class="line" data-act="shopAddresses">Endereços guardados <span>›</span></button><button class="line" data-auth="editPrefs">Preferências <span>›</span></button><button class="line" data-shop="support">Central de ajuda <span>›</span></button><button class="line" data-shop="issues">As minhas solicitações ('+shop.issues.length+') <span>›</span></button><button class="line" data-auth="tutorial">Ver tutorial <span>›</span></button></div><div class="panel"><h3>Área de negócios</h3><p class="muted">Acesso provisório para testar os perfis que futuramente terão uma aplicação independente.</p><div class="actions"><button class="btn outline" data-shop="roleProducer">Produtor</button><button class="btn outline" data-shop="roleCompany">Empresa</button></div></div><div class="panel"><p class="muted">Ambiente de demonstração. Nenhuma conta real ou transação financeira.</p>'+authButton(account.signed?'Terminar sessão':'Entrar ou criar conta','logout','outline')+'<div class="actions">'+btn('Limpar dados locais','reset','','danger small')+'</div><p class="credit"><a href="/photo-credits.html" target="_blank" rel="noopener">Créditos e licenças das fotografias</a></p></div>'}
const coachSteps=[{selector:'#query',title:'Procura os teus produtos',text:'Pesquisa por nome, município ou bancada.'},{selector:'.catphotos',title:'Escolhe uma categoria',text:'Encontra os alimentos de que precisas.'},{selector:'.shopcartbtn',title:'Adiciona ao carrinho',text:'Toca em Adicionar e usa os botões + e − para escolher quantidades.'},{selector:'[data-go="cart"]',title:'Revê o carrinho',text:'Confirma produtos, endereços e preferências de entrega.'},{selector:'[data-go="orders"]',title:'Acompanha as compras',text:'Consulta os pedidos, o histórico e o apoio. Nesta versão são simulações.'}];
document.addEventListener('click',e=>{const b=e.target.closest('[data-shop],[data-act="shopAddresses"],[data-act="customerCart"]');if(!b)return;const k=b.dataset.shop||b.dataset.act,id=b.dataset.id;if(role!=='buyer')return;if(k==='plus'||k==='minus'||k==='remove'){if(k==='remove'){delete shop.cart[id];saveShop()}else if(!setCart(id,k==='plus'?1:-1))return;const detail=$('#detailQty');render();if(detail&&$('#dialog').open)detail.innerHTML=qtyControls(detail.dataset.product);return}if(k==='customerCart'){close();navigate('cart');return}if(k==='shopAddresses'){addressList();return}if(k==='addAddress'||k==='editAddress'){addressForm(k==='editAddress'?id:'');return}if(k==='selectAddress'){shop.addressId=id;saveShop();close();render();return}if(k==='removeAddress'){if(confirm('Eliminar endereço local?')){shop.addresses=shop.addresses.filter(a=>a.id!==id);if(shop.addressId===id)shop.addressId='';saveShop();addressList();render()}return}if(k==='favorites'){category='Todos';query='';province='';onlyOffers=false;onlySaved=true;navigate('market');return}if(k==='orderFilter'){orderFilter=id;render();return}if(k==='reorder'){const o=db.orders.find(x=>x.id===id&&x.role==='buyer'),p=o&&productOf(o.product);if(!p){toast('Produto já não disponível');return}if(setCart(p.id,o.qty))toast('Adicionado ao carrinho');render();return}if(k==='support'){supportForm(id);return}if(k==='issues'){show('As minhas solicitações',shop.issues.length?shop.issues.map(x=>'<div class="panel"><strong>'+esc(x.kind)+'</strong><p>'+esc(x.note)+'</p><p class="muted">Rascunho local · '+esc(new Date(x.date).toLocaleDateString('pt-AO'))+'</p></div>').join(''):empty('Sem solicitações','Os pedidos de apoio locais aparecem aqui.'));return}if(k==='applyCoupon'){const f=$('#shopCheckout'),v=formData(f);shop.mode=v.mode;shop.slot=v.slot;const c=v.coupon.trim().toUpperCase();if(c&&c!=='ZUNGADEMO'){toast('Cupão inválido');return}shop.coupon=c;saveShop();render();toast(c?'Cupão demo aplicado':'Cupão removido');return}if(k==='roleProducer'||k==='roleCompany'){const select=$('#role');select.value=k==='roleProducer'?'producer':'company';select.dispatchEvent(new Event('change',{bubbles:true}))}});
document.addEventListener('change',e=>{if(e.target.closest('#shopCheckout')&&['mode','slot'].includes(e.target.name)){const v=formData($('#shopCheckout'));shop.mode=v.mode;shop.slot=v.slot;saveShop()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['shopAddressForm','shopCheckout','shopSupport'].includes(f.id))return;e.preventDefault();if(role!=='buyer')return;const v=formData(f);if(f.id==='shopAddressForm'){const id=f.dataset.id||uid();if(!v.label.trim()||!v.city.trim()||!v.street.trim())return;shop.addresses=[{id,label:v.label.trim(),province:v.province,city:v.city.trim(),street:v.street.trim()},...shop.addresses.filter(a=>a.id!==id)];shop.addressId=id;if(saveShop()){close();render();toast('Endereço guardado')}return}if(f.id==='shopSupport'){if(!v.note.trim())return;shop.issues.unshift({id:uid(),order:f.dataset.id,kind:v.kind,note:v.note.trim(),date:Date.now()});if(saveShop()){close();toast('Solicitação local guardada')}return}if(placeCart(v)){orderFilter='active';navigate('orders');toast('Pedido de demonstração criado')}else if(!cartValid())toast('Revê a disponibilidade dos produtos')});

$('#closeDialog').addEventListener('click',close);$('#dialog').addEventListener('close',()=>{activeStall=null});render();const params=new URLSearchParams(location.search);if(role==='producer'&&!producerAccount.signed){openProducerAuth()}else if(role==='buyer'&&!account.signed&&!account.guest){openAuth()}else if(role==='buyer'&&!account.tutorial){setTimeout(startCoach,200)}else{openIncoming()}
</script></body></html>
