function readPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve('');if(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('Escolhe uma imagem JPG, PNG ou WebP até 2 MB.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}

function companyHome(){const orders=db.orders.filter(o=>o.role==='company'),quotes=db.quotes;return heading('Central de compras',db.company.name||'ZUNGA Negócios · Empresa',btn('+ Cotação','quote'))+'<div class="bizhero"><div class="muted">ABASTECIMENTO</div><h2>Compra melhor para o teu negócio.</h2><p class="muted">Encontra fornecedores, compara propostas e organiza encomendas.</p><div class="actions"><button class="btn light" data-go="suppliers">Fornecedores</button><button class="btn outline" data-go="market">Pesquisar produtos</button></div></div><div class="metrics">'+metric('Pedidos em curso',orders.filter(o=>o.stage<4).length,'Registos locais')+metric('Cotações abertas',quotes.filter(q=>quoteStatus(q)==='open').length,'Solicitações de teste')+metric('Fornecedores guardados',business.saved.length,'Lista local')+metric('Valor solicitado',money(orders.reduce((s,o)=>s+o.total,0)),'Não é pagamento')+'</div><div class="bizlinks"><button class="btn outline" data-go="quotes">Cotações e propostas</button><button class="btn outline" data-go="orders">Encomendas</button></div>'+section('Cotações recentes',quotes.length?quotes.slice(0,3).map(quoteCard).join(''):empty('Sem cotações','Cria um pedido de cotação para testar.'),go('Ver todas','quotes'))+section('Fornecedores','<div class="grid">'+allStalls().filter(s=>s.id!=='mine'||db.products.length).slice(0,3).map(supplierCard).join('')+'</div>',go('Ver todos','suppliers'))}
function supplierCard(s){const ps=allProducts().filter(p=>p.stall===s.id);return '<article class="bizcard"><div class="bizsupplier"><div class="prodthumb">'+(imageSafe(s.photo)?'<img src="'+s.photo+'" alt="">':photoTag(photoFiles[stallPhotos[s.id]||'b1'],'Imagem ilustrativa',160))+'</div><div><h3>'+esc(s.name)+'</h3><div class="muted">'+esc(s.city)+', '+esc(s.province)+' · '+ps.length+' produtos</div></div></div><p class="biznote">'+esc(s.bio||'Fornecedor agrícola')+'</p><div class="actions"><button class="btn outline small" data-biz="supplierView" data-id="'+esc(s.id)+'">Catálogo</button><button class="btn outline small" data-biz="saveSupplier" data-id="'+esc(s.id)+'">'+(business.saved.includes(s.id)?'Guardado':'Guardar')+'</button><button class="btn small" data-biz="targetQuote" data-id="'+esc(s.id)+'">Cotação</button></div></article>'}
function supplierDirectory(){const rows=allStalls().filter(s=>(s.id!=='mine'||db.products.length)&&(supplierFilter!=='saved'||business.saved.includes(s.id))&&norm([s.name,s.city,s.province,...allProducts().filter(p=>p.stall===s.id).map(p=>p.name)].join(' ')).includes(norm(supplierQuery)));return heading('Fornecedores','Bancadas, produtores e distribuidores.')+'<form id="supplierSearch" class="searchrow"><input name="query" aria-label="Pesquisar fornecedor" value="'+esc(supplierQuery)+'" placeholder="Nome, província ou produto"><button class="btn" type="submit">Pesquisar</button></form><div class="biztabs"><button class="chip '+(supplierFilter==='all'?'active':'')+'" data-biz="supplierFilter" data-id="all">Todos</button><button class="chip '+(supplierFilter==='saved'?'active':'')+'" data-biz="supplierFilter" data-id="saved">Guardados</button></div>'+(rows.length?rows.map(supplierCard).join(''):empty('Sem fornecedores','Altera a pesquisa ou os filtros.'))}
function companyMarket(){const rows=filterProducts().filter(p=>p.stock>=companyStock);return heading('Compras a grosso','Pesquisa produtos, disponibilidade e fornecedores.',go('Fornecedores','suppliers'))+searchBox()+'<div class="formrow"><label class="field">Categoria<select id="companyCategory">'+options(cats,category)+'</select></label><label class="field">Província<select id="filterProvince"><option value="">Todas</option>'+options(provinces,province)+'</select></label></div><div class="formrow"><label class="field">Stock mínimo<input id="companyStock" type="number" min="0" max="1000000" value="'+companyStock+'"></label><label class="field">Ordenar<select id="sort"><option value="recommended">Relevância</option><option value="low">Menor preço</option><option value="high">Maior preço</option><option value="stock">Maior stock</option></select></label></div><p class="biznote">Compara preços e stock apenas entre embalagens e unidades equivalentes.</p>'+(rows.length?rows.map(p=>'<article class="bizcard"><div class="bizsupplier"><div class="prodthumb">'+realPhoto(p)+'</div><div><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(stallOf(p).name)+' · '+esc(stallOf(p).province)+'</div><div class="price">'+money(p.price)+' / '+esc(p.unit)+'</div><div class="muted">Stock: '+p.stock+' · Mínimo: '+(p.minimum||1)+'</div></div></div><div class="actions">'+btn('Ver produto','product',p.id,'outline small')+'<button class="btn small" data-biz="productQuote" data-id="'+esc(p.id)+'">Pedir cotação</button></div></article>').join(''):empty('Sem produtos','Altera os filtros de compra.'))}
function quoteForm(target='',productId='',existing=null){const pr=productOf(productId),q=existing||{};show(existing?'Editar cotação':'Nova cotação','<form id="businessQuote" data-id="'+esc(q.id||'')+'">'+input('Produto pretendido','name',q.name||pr?.name||'','required maxlength="90"')+'<div class="formrow">'+input('Quantidade','qty',q.qty||pr?.minimum||1,'type="number" min="1" max="1000000" required')+select('Unidade','unit',['kg','saco','caixa','tonelada','unidade','pacote','embalagem','garrafa','litro'],q.unit||pr?.unit||'kg')+'</div><label class="field">Fornecedor<select name="target"><option value="">Todos os fornecedores</option>'+allStalls().map(s=>'<option value="'+esc(s.id)+'" '+((q.target||target)===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'+select('Província de destino','province',provinces,q.province||db.company.province||'Huíla')+input('Município / destino','city',q.city||db.company.city||'','required maxlength="60"')+input('Data pretendida (opcional)','deadline',q.deadline||'','type="date"')+'<label class="field">Especificações e condições<textarea name="note" rows="3" maxlength="500">'+esc(q.note||'')+'</textarea></label><p class="biznote">A cotação fica apenas neste dispositivo. Podes abrir o pedido para simular uma resposta de fornecedor.</p>'+submit('Guardar rascunho')+'</form>')}
function quoteCard(q){return '<article class="bizcard"><div class="line"><div><h3>'+esc(q.name)+'</h3><div class="muted">'+esc(q.qty)+' '+esc(q.unit)+' · '+esc(q.province)+'</div></div><span class="rfqstatus">'+quoteLabel(q)+'</span></div><p class="biznote">'+esc(q.target?allStalls().find(s=>s.id===q.target)?.name||'Fornecedor':'Todos os fornecedores')+' · '+quoteResponses(q.id).length+' proposta(s)</p><div class="actions"><button class="btn outline small" data-biz="quoteDetails" data-id="'+esc(q.id)+'">Ver propostas</button>'+(quoteStatus(q)==='draft'?'<button class="btn outline small" data-biz="editQuote" data-id="'+esc(q.id)+'">Editar</button><button class="btn small" data-biz="openQuote" data-id="'+esc(q.id)+'">Abrir cotação</button>':quoteStatus(q)==='open'?'<button class="btn outline small" data-biz="closeQuote" data-id="'+esc(q.id)+'">Encerrar</button>':'')+'</div></article>'}
function quoteList(){return heading('Cotações e propostas','Solicita e compara condições comerciais.',btn('+ Cotação','quote'))+(db.quotes.length?db.quotes.map(quoteCard).join(''):empty('Nenhuma cotação','Cria uma solicitação para testar o fluxo empresarial.'))}
function quoteDetails(id){const q=db.quotes.find(x=>x.id===id);if(!q)return;const rs=quoteResponses(id).slice().sort((a,b)=>a.price-b.price);show('Cotação: '+q.name,'<div class="bizcard"><p>'+esc(q.qty)+' '+esc(q.unit)+' · '+esc(q.city||'')+' '+esc(q.province)+'</p><p class="muted">'+esc(q.note||'Sem condições adicionais')+'</p><span class="rfqstatus">'+quoteLabel(q)+'</span></div>'+(rs.length?rs.map(r=>'<div class="bizcard"><h3>'+esc(allStalls().find(s=>s.id===r.stall)?.name||'Fornecedor')+'</h3><p class="price">'+money(r.price)+' / '+esc(q.unit)+'</p><p>Total dos produtos: '+money(r.price*Number(q.qty))+'</p><p class="muted">Prazo: '+esc(r.days)+' dia(s) · '+esc(r.note||'Sem observações')+'</p>'+(q.accepted===r.id?'<span class="rfqstatus">Aceite</span>':quoteStatus(q)==='open'?'<button class="btn" data-biz="acceptResponse" data-id="'+esc(r.id)+'">Aceitar proposta demo</button>':'')+'</div>').join(''):empty('Sem propostas','As respostas de fornecedores aparecerão aqui.'))+(quoteStatus(q)==='open'?'<p class="biznote">Podes simular respostas de bancadas de exemplo ou responder a partir da área do produtor.</p><button class="btn outline" data-biz="sampleResponse" data-id="'+esc(q.id)+'">Simular propostas de exemplo</button>':'')+'<p class="biznote">Aceitação local, sem contrato, reserva de stock ou cobrança.</p>')}
function supplierRequests(){const rows=db.quotes.filter(q=>['open','accepted','closed'].includes(quoteStatus(q))&&(!q.target||q.target==='mine')&&(rfqFilter==='all'||quoteStatus(q)==='open'));return heading('Pedidos de cotação','Responde a pedidos empresariais locais.')+'<div class="biztabs"><button class="chip '+(rfqFilter==='open'?'active':'')+'" data-biz="rfqFilter" data-id="open">Abertos</button><button class="chip '+(rfqFilter==='all'?'active':'')+'" data-biz="rfqFilter" data-id="all">Histórico</button></div>'+(rows.length?rows.map(q=>{const r=quoteResponses(q.id).find(x=>x.stall==='mine');return '<div class="bizcard"><div class="line"><h3>'+esc(q.name)+'</h3><span class="rfqstatus">'+quoteLabel(q)+'</span></div><p>'+esc(q.qty)+' '+esc(q.unit)+' · '+esc(q.city||'')+' '+esc(q.province)+'</p><p class="muted">'+esc(q.note||'')+'</p>'+(r?'<p>Proposta: '+money(r.price)+' / '+esc(q.unit)+(q.accepted===r.id?' · Aceite':'')+'</p>':'')+(quoteStatus(q)==='open'?'<button class="btn" data-biz="respond" data-id="'+esc(q.id)+'">'+(r?'Editar proposta':'Enviar proposta demo')+'</button>':'')+'</div>'}).join(''):empty('Sem solicitações','Abre uma cotação como empresa para experimentar.'))}
function responseForm(id){const q=db.quotes.find(x=>x.id===id);if(!q||quoteStatus(q)!=='open'||q.target&&q.target!=='mine')return;const r=quoteResponses(id).find(x=>x.stall==='mine')||{};show('Responder à cotação','<form id="businessResponse" data-id="'+esc(id)+'"><p>'+esc(q.name)+' · '+esc(q.qty)+' '+esc(q.unit)+'</p>'+input('Preço por '+q.unit,'price',r.price||'','type="number" min="1" max="1000000000" required')+input('Prazo estimado (dias)','days',r.days||1,'type="number" min="1" max="365" required')+'<label class="field">Condições<textarea name="note" rows="3" maxlength="400">'+esc(r.note||'')+'</textarea></label><p class="biznote">Proposta demonstrativa, não enviada pela internet.</p>'+submit('Guardar proposta')+'</form>')}
function producerHome(){const pending=db.quotes.filter(q=>quoteStatus(q)==='open'&&(!q.target||q.target==='mine')).length;return '<div class="business-top"><div class="muted">ZUNGA NEGÓCIOS · FORNECEDOR</div><button class="btn outline small" data-go="rfqs">Cotações ('+pending+')</button></div>'+v4ProducerHome()+section('Compras empresariais','<div class="bizcard"><h3>'+pending+' cotação(ões) aberta(s)</h3><p class="biznote">Consulta solicitações de empresas e apresenta preços e condições.</p><button class="btn" data-go="rfqs">Ver pedidos de cotação</button></div>')}
function businessProfile(){return heading('Perfil empresarial','Identidade e configurações da organização.')+'<div class="bizhero"><h2>'+esc(db.company.name||'Empresa de demonstração')+'</h2><p class="muted">'+esc(business.email)+' · '+esc(db.company.sector||'Setor por definir')+'</p></div>'+companyProfile()+'<div class="bizcard"><h3>Conta demonstrativa</h3><p class="biznote">Não há validação de NIF, autenticação real ou isolamento de dados.</p><button class="btn outline" data-biz="authLogout">Terminar sessão</button></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-discovery],[data-biz]');if(!b)return;if(b.dataset.discovery){if(role!=='buyer')return;if(b.dataset.discovery==='clear')resetMarket();else{province='';query='';sort='recommended'}render();motion($('#view'));return}const k=b.dataset.biz,id=b.dataset.id;if(k==='authBuyer'){hideAuth();role='buyer';db.role=role;save();navigate('home');if(!account.signed&&!account.guest)openAuth();return}if(k==='authDemo'){if(role==='company')enterBusiness('empresa@zunga.test');return}if(k==='authLogout'){business.signed=false;saveBusiness();openBusinessAuth();return}if(['authRegister','authLogin','authBack'].includes(k)){businessPage=k==='authRegister'?'register':k==='authLogin'?'login':'welcome';renderBusinessAuth();return}if(role==='producer'){if(k==='rfqFilter'){rfqFilter=id;render()}else if(k==='respond')responseForm(id);return}if(role!=='company'||!business.signed)return;const q=db.quotes.find(x=>x.id===id);if(k==='supplierFilter'){supplierFilter=id;render()}else if(k==='saveSupplier'){business.saved=business.saved.includes(id)?business.saved.filter(x=>x!==id):[...business.saved,id];saveBusiness();render()}else if(k==='supplierView'){showStall(id)}else if(k==='targetQuote'){quoteForm(id)}else if(k==='productQuote'){const p=productOf(id);if(p)quoteForm(p.stall,id)}else if(k==='quoteDetails'){quoteDetails(id)}else if(k==='editQuote'&&q&&quoteStatus(q)==='draft'){quoteForm('','',q)}else if(k==='openQuote'&&q&&quoteStatus(q)==='draft'){q.status='open';save();render();toast('Cotação aberta localmente')}else if(k==='closeQuote'&&q&&quoteStatus(q)==='open'){q.status='closed';save();render()}else if(k==='sampleResponse'&&q&&quoteStatus(q)==='open'){const sellers=sampleStalls.filter(s=>!q.target||q.target===s.id);for(const s of sellers.slice(0,3)){const matching=allProducts().find(p=>p.stall===s.id&&p.unit===q.unit&&norm(p.name).includes(norm(q.name)));if(!matching||matching.stock<Number(q.qty)||quoteResponses(q.id).some(r=>r.stall===s.id))continue;business.responses.push({id:uid(),quote:q.id,stall:s.id,price:matching.price,days:3,note:'Proposta simulada a partir do catálogo de exemplo',demo:true})}saveBusiness();quoteDetails(q.id);if(!quoteResponses(q.id).length)toast('Nenhum exemplo com produto, unidade e stock compatíveis')}else if(k==='acceptResponse'){const r=business.responses.find(x=>x.id===id),q=r&&db.quotes.find(x=>x.id===r.quote);if(q&&quoteStatus(q)==='open'){q.status='accepted';q.accepted=r.id;save();close();render();toast('Proposta aceite localmente; sem compromisso real')}}});
document.addEventListener('change',e=>{if(role!=='company')return;if(e.target.id==='companyCategory'){category=e.target.value;render()}else if(e.target.id==='companyStock'){companyStock=Math.max(0,Math.min(1000000,Number(e.target.value)||0));render()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['businessAuthForm','supplierSearch','businessQuote','businessResponse'].includes(f.id))return;e.preventDefault();const v=formData(f);if(f.id==='businessAuthForm'){if(role!=='company')return;const email=v.email.trim().toLowerCase(),reg=businessPage==='register';if(v.password!==demoPassword||!email.endsWith('.test')||(reg&&(v.confirm!==v.password||!v.name.trim()||!v.sector.trim()))||(!reg&&email!=='empresa@zunga.test'&&email!==business.email)){$('#bizError').textContent='Confirma os dados fictícios e a palavra-passe demo.';return}if(reg)db.company={...db.company,name:v.name.trim(),sector:v.sector.trim(),province:v.province};enterBusiness(email);return}if(f.id==='businessResponse'){if(role!=='producer'||!producerAccount.signed)return;const q=db.quotes.find(x=>x.id===f.dataset.id),price=Number(v.price),days=Number(v.days);if(!q||quoteStatus(q)!=='open'||q.target&&q.target!=='mine'||!Number.isFinite(price)||price<=0||!Number.isInteger(days)||days<1)return;const old=quoteResponses(q.id).find(x=>x.stall==='mine');business.responses=[...business.responses.filter(r=>r.id!==old?.id),{id:old?.id||uid(),quote:q.id,stall:'mine',price,days,note:v.note.trim(),demo:true}];if(saveBusiness()){close();render();toast('Proposta guardada localmente')}return}if(role!=='company'||!business.signed)return;if(f.id==='supplierSearch'){supplierQuery=v.query.trim();render();return}const qty=Number(v.qty),old=db.quotes.find(q=>q.id===f.dataset.id);if(!v.name.trim()||!v.city.trim()||!Number.isInteger(qty)||qty<1||old&&quoteStatus(old)!=='draft')return;const q={id:old?.id||uid(),name:v.name.trim(),qty,unit:v.unit,province:v.province,city:v.city.trim(),target:v.target,deadline:v.deadline,note:v.note.trim(),status:'draft',date:Date.now()};db.quotes=[q,...db.quotes.filter(x=>x.id!==q.id)];if(save()){close();navigate('quotes');toast('Rascunho guardado')}});

$('#closeDialog').addEventListener('click',dismissDialog);$('#dialog').addEventListener('cancel',e=>{if(typeof $('#dialog').animate==='function'&&!reducedMotion()){e.preventDefault();dismissDialog()}});$('#dialog').addEventListener('close',()=>{activeStall=null});render();const params=new URLSearchParams(location.search);if(role==='producer'&&!producerAccount.signed){openProducerAuth()}else if(role==='company'&&!business.signed){openBusinessAuth()}else if(role==='buyer'&&!account.signed&&!account.guest){openAuth()}else if(role==='buyer'&&!account.tutorial){setTimeout(startCoach,200)}else{openIncoming()}
</script></body></html>
