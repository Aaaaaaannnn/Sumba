function sumbaTrackOrderChanges(previous){

 const prevMap=new Map(prevOrders.map(order=>[order.id,order]));
 for(const order of Array.isArray(db.orders)?db.orders:[]){
  const prior=prevMap.get(order.id);

 }
}

 '<button type="button" class="btn light small" '+card.action+'>'+esc(card.cta)+'</button></div></div></article>').join('')+

function initSumbaCarousel(){
 if(sumbaCarouselTimer)clearInterval(sumbaCarouselTimer);
 sumbaCarouselTimer=null;
 const track=document.getElementById('sumbaCarouselTrack');
 if(!track)return;
 const slides=Array.from(track.children),total=slides.length;
 const root=track.closest('.sumba-carousel'),status=root.querySelector('#sumbaCarouselStatus');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches||!v16Settings().motion;
 let active=0,held=false,hovered=false,holdUntil=0,programmatic=false;
 const step=()=>slides.length>1?slides[1].offsetLeft-slides[0].offsetLeft:track.clientWidth;
 const navigate=(i,manual=false)=>{
  active=(i+total)%total;
  if(manual){holdUntil=Date.now()+12000;status.textContent='Cartão '+(active+1)+' de '+total}
  programmatic=true;
  track.scrollTo({left:active*step(),behavior:reduced?'instant':'smooth'});
  // O estado programmatic é usado apenas para evitar confusão durante o scroll.
  programmatic=false;
 };
 const pause=()=>{holdUntil=Date.now()+12000};
 track.addEventListener('pointerdown',()=>{held=true;pause()},{passive:true});
 track.addEventListener('pointerup',()=>{held=false;pause()},{passive:true});
 track.addEventListener('pointercancel',()=>{held=false;pause()},{passive:true});
 track.addEventListener('wheel',pause,{passive:true});
 track.addEventListener('touchend',pause,{passive:true});
 root.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hovered=true});
 root.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hovered=false;held=false});
 root.addEventListener('click',pause);
 track.addEventListener('scroll',()=>{
  const next=Math.max(0,Math.min(total-1,Math.round(track.scrollLeft/Math.max(step(),1))));
  active=next;
 });
 track.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
   e.preventDefault();navigate(active+(e.key==='ArrowRight'?1:-1),true);
  }

function receiptData(kind,id){if(!documentRows().some(r=>r.kind===kind&&r.id===id))return null;let lines=[],title='Comprovativo';const orderLine=o=>[o.name+' | '+o.qty+' '+o.unit+' | '+money(o.total)+(o.stage===5?' (cancelado; excluido do total)':''),'Bancada: '+(allStalls().find(s=>s.id===o.stall)?.name||'Bancada')+' | Estado: '+(stages[o.stage]||'Solicitado'),...(o.commerceV13?['Preco unitario aplicado: '+money(o.unitPrice),...(o.discount?['Desconto: '+money(o.discount)]:[]),...(o.deliveryEstimate?['Parcela estimada de entrega: '+money(o.deliveryEstimate)]:[]), ]:[]),...(o.stage===5?['Motivo do cancelamento: '+(o.cancelReason||'Cancelada')]:[])];if(kind==='movement'){const m=stockMoves().find(x=>x.id===id&&x.v14);if(!m)return null;title='Ficha de movimentação';lines=movementRows(m).map(r=>r.join(' | '))}else if(kind==='form'){const f=studio.forms.find(x=>x.id===id);title=f.kind;lines=['Data: '+f.date,'Responsável: '+f.person,'Referência: '+f.ref,'Produto / carga: '+f.product,'Quantidade: '+f.qty+' '+f.unit,'Origem: '+f.origin,'Destino / armazém: '+f.destination,'Observações: '+f.note,'Registo manual, não altera o stock nem comprova a entrega.']}else if(kind==='purchase'){const g=orderGroups().find(g=>g.id===id);title='Registo de encomenda';lines=['Data: '+new Date(g.date).toLocaleString('pt-AO'),...g.items.flatMap(orderLine),'Total dos produtos: '+money(g.total),...(g.delivery?['Entrega estimada (fictícia): '+money(g.delivery),'Total estimado: '+money(g.total+g.delivery)]:[])]}else if(kind==='order'){const o=db.orders.find(x=>x.id===id);title=role==='producer'?'Registo de venda':'Registo de compra';lines=['Data: '+new Date(o.date).toLocaleString('pt-AO'),...orderLine(o),'Total dos produtos: '+money(o.stage===5?0:o.total)]}else if(kind==='quote'){const q=db.quotes.find(x=>x.id===id);title='Registo de cotação';lines=[q.name+' | '+q.qty+' '+q.unit,'Destino: '+(q.city||'')+' '+q.province,'Estado: '+quoteLabel(q),...quoteResponses(q.id).filter(r=>role==='company'||r.st function pdfText(s){return Array.from(String(s).replace(/\s+/g,' ')).map(c=>{const n=c.charCodeAt(0);if(c==='('||c===')'||c==='\\')return '\\'+c;if(n>=32&&n<=126)return c;if(n>=160&&n<=255)return '\\'+n.toString(8).padStart(3,'0');return '?'}).join('')}
function wrapPDF(s){const words=String(s).replace(/\s+/g,' ').split(' '),out=[];let line='';for(let w of words){while(w.length>78){if(line){out.push(line);line=''}out.push(w.slice(0,78));w=w.slice(78)}if(line&&line.length+w.length>78){out.push(line);line=w}else line+=(line?' ':'')+w}if(line)out.push(line);return out}
function buildPDF(doc){const rows=doc.lines.flatMap(wrapPDF),pages=[];for(let i=0;i<Math.max(1,rows.length);i+=32)pages.push(rows.slice(i,i+32));if(doc.chart)pages.unshift([]);const objects=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'];const kids=[];pages.forEach((rows,i)=>{const p=objects.length+1,c=p+1;kids.push(p+' 0 R');let stream='0.07 0.24 0.17 rg 0 755 595 87 re f\nBT /F1 25 Tf 1 1 1 rg 40 804 Td (SUMBA) Tj ET\nBT /F1 11 Tf 1 1 1 rg 40 780 Td ('+pdfText('Do campo à sua mesa.')+') Tj ET\nBT /F1 20 Tf 0.07 0.24 0.17 rg 40 716 Td ('+pdfText(doc.title)+') Tj ET\nBT /F1 11 Tf 0.55 0.21 0.1 rg 40 690 Td (DEMONSTRACAO - SEM VALIDADE FISCAL) Tj ET\nBT /F1 11 Tf 0.13 0.2 0.15 rg 40 660 Td 17 TL\n'+rows.map((s,j)=>(j?'T* ':'')+'('+pdfText(s)+') Tj').join('\n')+'\nET\nBT /F1 10 Tf 0.3 0.3 0.3 rg 40 58 Td (Nenhum pagamento, contrato ou assinatura digital comprovados.) Tj ET\nBT /F1 10 Tf 0.3 0.3 0.3 rg 40 40 Td (Pagina '+(i+1)+' de '+pages.length+') Tj ET\n';if(doc.chart&&i===0)stream+=chartPDF(doc.chart);objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents '+c+' 0 R >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream')});objects[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});const xref=pdf.length;pdf+='xref\n0 '+offsets.length+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';return pdf}

function termsContent(){return '<h3>Termos de utilização — versão 1.0 demo</h3><p><strong>1. Natureza do serviço.</strong> A SUMBA é um protótipo de mercado agrícola. Não existem pagamentos reais, contratos concluídos pela plataforma ou garantias de entrega.</p><p><strong>2. Contas e dados.</strong> Usa dados fictícios. Não partilhes palavras-passe, documentos pessoais, dados bancários ou informação confidencial. Os registos estão neste navegador; podem ser apagados nas configurações.</p><p><strong>3. Comércio.</strong> Os produtores devem fornecer descrições, preços, quantidades e imagens corretos, e ter autorização para comercializar os produtos. Não são permitidos bens ilícitos, publicidade enganosa, fraude ou venda de produtos impróprios.</p><p><strong>4. Conduta.</strong> São proibidos insultos, assédio, ameaças, discriminação, conteúdo sexual impróprio, spam e divulgação de dados de terceiros sem autorização.</p><p><strong>5. Conteúdo.</strong> Publica apenas fotografias, vídeos e comentários de que tens direitos. A moderação pode ocultar conteúdo, e o responsável pode pedir revisão.</p><p><strong>6. Avaliações.</strong> Avalia experiências genuínas. As avaliações de teste podem estar ligadas a encomendas locais concluídas ou ser opiniões não verificadas. Apenas comentários favoráveis ligados a encomendas concluídas e aprovados podem aparecer como testemunhos selecionados; os restantes ficam disponíveis à entidade avaliada e à administração. A seleção pública não representa a distribuição completa.</p><p><strong>7. Mensagens.</strong> O assistente automático nesta versão usa regras, não IA real. Pedidos de operador ficam em fila local. Não introduzas dados sensíveis.</p><p><strong>8. Subscrições, logística e documentos.</strong> Valores, comprovativos, fichas e estatísticas são demonstrativos; não constituem faturas, recibos fiscais, pagamentos ou assinaturas.</p><p><strong>9. Revisão.</strong> Antes de lançamento comercial serão necessários termos e política de privacidade definitivos, revisão jurídica, segurança, suporte e regras de resolução de litígios.</p>'}
function termsCheckbox(id=''){return '<details class="termsbox"><summary>Consultar termos de utilização</summary>'+termsContent()+'</details><label class="checkbox"><input type="checkbox" name="acceptTerms" '+(id?'id="'+id+'"':'')+' required> Li e aceito os termos de utilização (versão 1.0 demo).</label>'}
function recordTerms(r){studio.terms[r]={version:'1.0-demo',date:Date.now()};saveStudio()}
function offensive(s){const t=norm(String(s)).replace(/[0-9]/g,c=>({0:'o',1:'i',3:'e',4:'a',5:'s',7:'t'}[c]||c));return /(?:^|[^a-z])(idiota|imbecil|merda|caralho|puta|puto|otario|estupido|burro|vai te foder|vou te matar|vou matar te)(?:$|[^a-z])/.test(t)}
function flagText(s,where){if(!offensive(s))return false;studio.flags.unshift({id:uid(),role,where,date:Date.now(),status:'review'});studio.flags=studio.flags.slice(0,150);saveStudio();toast('Revê a linguagem. O texto não foi publicado.');return true}
const studioBtn=(t,k,id='',style='outline small')=>'<button type="button" class="btn '+style+'" data-studio="'+k+'" data-id="'+esc(id)+'">'+esc(t)+'</button>';
function profileInfo(){const base=role==='buyer'?account:role==='producer'?producerAccount:role==='company'?{name:db.company.name,email:business.email,city:db.company.city,province:db.company.province}:{};const p={...base,...studio.profiles[role]};if(p.email)p.email=sumbaDemoEmail(p.email);return p}
function profilePanel(){const p=profileInfo();return '<div class="panel account-summary">'+sumbaProfileBrand()+'<div class="accounthead">'+(imageSafe(p.photo)?'<img class="profile-photo" src="'+p.photo+'" alt="Foto de perfil">':'<div class="accountavatar">'+esc((p.name||roleNames[role]).slice(0,1).toUpperCase())+'</div>')+'<div><h3>'+esc(p.name||roleNames[role])+'</h3><p class="muted">'+esc(p.email||'Perfil de demonstração')+'</p>'+(p.bio?'<p class="opstext">'+esc(p.bio)+'</p>':'')+'</div></div><button class="btn outline profile-edit" data-studio="editProfile">'+profileIcon('edit')+' Editar perfil'+(role==='producer'?' pessoal':'')+'</button></div>'}
function profileForm(){const p=profileInfo();show('Editar perfil','<form id="studioProfile">'+input('Nome','name',p.name||'','required maxlength="80"')+input('Email fictício (opcional)','email',p.email||'','type="email" maxlength="100"')+select('Província','province',provinces,p.province||'Huíla')+input('Município','city',p.city||'','maxlength="60"')+'<label class="field">Apresentação<textarea name="bio" maxlength="300" rows="3">'+esc(p.bio||'')+'</textarea></label><label class="field">Foto de perfil (JPG, PNG ou WebP, até 350 KB)<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label><label class="checkbox"><input type="checkbox" name="removePhoto"> Remover fotografia atual</label>'+submit('Guardar perfil')+'</form>')}
function opsProfile(){return heading('O meu perfil','Conta de '+roleNames[role].toLowerCase())+profilePanel()+'<div class="panel"><button class="btn outline" data-go="terms">Termos de utilização</button>'+opBtn('Terminar sessão','opsLogout','','outline')+'</div>'}
function formsPage(){const linked=['producer','admin'].includes(role)?section('Fichas geradas pelo armazém',stockMoves().filter(m=>m.v14).map(moveCard).join('')||empty('Sem movimentações','Regista uma movimentação no armazém.')):'';const rows=studio.forms.filter(f=>f.role===role||role==='admin');return heading('Fichas operacionais','Registos manuais de trabalho',studioBtn('+ Nova ficha','newForm','',''))+'<p class="opstext">As fichas manuais não alteram stock. As fichas geradas pelo armazém documentam movimentações já registadas.</p>'+linked+rows.map(f=>'<article class="bizcard"><h3>'+esc(f.kind)+'</h3><p>'+esc(f.product)+' · '+esc(f.qty)+' '+esc(f.unit)+'</p><p class="muted">'+esc(f.date)+' · '+esc(f.ref)+' · '+roleNames[f.role]+'</p><div class="actions">'+(f.role===role?studioBtn('Editar','editForm',f.id):'')+docButton('form',f.id)+studioBtn('Excel','formXlsx',f.id)+studioBtn('Word','formDocx',f.id)+'</div></article>').join('')+(rows.length?'':empty('Sem fichas','Cria uma ficha de acordo com a tua operação.'))}
function operationalForm(id=''){if(!formKinds[role])return;const f=studio.forms.find(x=>x.id===id&&x.role===role)||{};show(id?'Editar ficha':'Nova ficha','<form id="studioForm" data-id="'+esc(id)+'">'+select('Tipo de ficha','kind',formKinds[role],f.kind)+input('Data','date',f.date||new Date().toISOString().slice(0,10),'type="date" required')+input('Referência / documento','ref',f.ref||'','maxlength="80" required')+input('Responsável','person',f.person||profileInfo().name||'','required maxlength="80"')+input('Produto ou carga','product',f.product||'','required maxlength="100"')+'<div class="formrow">'+input('Quantidade','qty',f.qty||'','type="number" min="0" step="any" max="1000000000" required')+select('Unidade','unit',['kg','saco','caixa','tonelada','unidade','pacote','embalagem','garrafa','litro'],f.unit)+'</div>'+input('Origem','origin',f.origin||'','maxlength="120"')+input('Destino / armazém','destination',f.destination||'','maxlength="120"')+'<label class="field">Observações / lote / estado<textarea name="note" rows="4" maxlength="600">'+esc(f.note||'')+'</textarea></label>'+submit('Guardar ficha')+'</form>')}
function fileDownload(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function exportForm(id,format){const f=studio.forms.find(x=>x.id===id&&(x.role===role||role==='admin'));if(!f)return;const rows=[['SUMBA — '+f.kind],['Demonstração — sem validade fiscal'],['Referência',f.ref],['Data',f.date],['Responsável',f.person],['Produto',f.product],['Quantidade',f.qty],['Unidade',f.unit],['Origem',f.origin],['Destino',f.destination],['Observações',f.note]];fileDownload(v9ReportBlob(format,{title:f.kind,rows}),'SUMBA-ficha-'+f.id+'.'+format)}
let activeChat='';
function threads(){return Array.from(new Set(studio.messages.map(m=>m.thread).concat(studio.handoffs.map(h=>h.thread)))).filter(t=>role==='admin'||role==='producer'&&(t.endsWith(':mine')||t==='producer:support')||role==='buyer'&&t.startsWith('buyer:')||role==='company'&&t.startsWith('company:')||role==='courier'&&t==='courier:support')}
function allowedThread(t){if(role==='admin')return threads().includes(t);if(role==='producer')return t.endsWith(':mine')&&/^(buyer|company):mine$/.test(t)||t==='producer:support';if(role==='courier')return t==='courier:support';return t.startsWith(role+':')&&(t.endsWith(':support')||allStalls().some(s=>t===role+':'+s.id))}
function threadName(t){const [r,s]=t.split(':');return role==='producer'&&s==='mine'?roleNames[r]+' local':role==='admin'?roleNames[r]+' · '+(allStalls().find(x=>x.id===s)?.name||'Apoio'):s==='support'?'Apoio SUMBA':allStalls().find(x=>x.id===s)?.name||'Conversa'}
function openChat(s){const t=role==='buyer'||role==='company'?role+':'+s:s;if(!allowedThread(t))return;activeChat=t;close();navigate('chat')}
function autoReply(text){const t=norm(text);if(/preco|stock|produto|catalogo/.test(t))return 'Consulta o catálogo da bancada para ver preços e disponibilidade. Os valores são demonstrativos.';if(/entrega|prazo|pedido|rastre/.test(t))return 'Consulta Pedidos para acompanhar o estado local. Não existe rastreamento ou prazo confirmado.';if(/pagamento|pagar|recibo/.test(t))return 'A SUMBA ainda não realiza pagamentos. Os comprovativos são apenas demonstrativos.';if(/ola|bom dia|boa tarde|boa noite/.test(t))return 'Olá! Posso orientar-te sobre catálogo, pedidos e comprovativos. Como posso ajudar?';return ''}
function requestOperator(t){if(!studio.handoffs.some(h=>h.thread===t&&h.status==='waiting'))studio.handoffs.push({id:uid(),thread:t,status:'waiting',date:Date.now()})}
function sendMessage(t,text){if(!allowedThread(t)||!text.trim()||text.length>800||flagText(text,'Mensagem'))return false;studio.messages.push({id:uid(),thread:t,from:role,text:text.trim(),date:Date.now()});if((['buyer','company','courier'].includes(role)||role==='producer'&&t==='producer:support')&&!studio.handoffs.some(h=>h.thread===t&&['waiting','assigned'].includes(h.status))){const reply=autoReply(text);if(reply)studio.messages.push({id:uid(),thread:t,from:'assistant',text:reply,date:Date.now()});else{requestOperator(t);studio.messages.push({id:uid(),thread:t,from:'assistant',text:'O pedido foi encaminhado para a fila local de operador. Ainda não existe atendimento entre dispositivos.',date:Date.now()})}}return saveStudio()}
function chatPage(){const list=threads(),customer=['buyer','company'].includes(role),available=customer?[...allStalls().map(s=>role+':'+s.id),role+':support']:role==='courier'?['courier:support']:role==='producer'?['producer:support',...list]:list;const unique=[...new Set([...available,...list])];if(!allowedThread(activeChat)||!unique.includes(activeChat))activeChat=unique[0]||'';const messages=studio.messages.filter(m=>m.thread===activeChat),waiting=studio.handoffs.find(h=>h.thread===activeChat&&['waiting','assigned'].includes(h.status));return heading('Mensagens','Conversas locais e atendimento')+'<div class="notice">Assistente automático por regras (não IA real). Mensagens e fila de operador apenas neste dispositivo.</div><div class="panel"><label class="field">Conversa<select id="chatThread"><option value="">Seleciona uma conversa</option>'+unique.map(t=>'<option value="'+esc(t)+'" '+(t===activeChat?'selected':'')+'>'+esc(threadName(t))+'</option>').join('')+'</select></label></div>'+(activeChat?'<div class="panel"><h3>'+esc(threadName(activeChat))+'</h3>'+messages.map(m=>'<div class="chat-bubble '+(m.from===role?'mine':'')+'"><small>'+esc((m.from==='assistant'?'Assistente automático':roleNames[m.from]||m.from)+(m.seeded?' · Exemplo':''))+'</small>'+esc(m.text)+'</div>').join('')+(messages.length?'':'<p class="muted">Inicia uma conversa.</p>')+(waiting?'<p class="opsstatus">'+(waiting.status==='assigned'?'Operador local assumiu':'A aguardar operador local')+'</p>':'')+'<form id="studioMessage" class="chat-composer"><label class="field">Mensagem<textarea name="text" rows="2" maxlength="800" required placeholder="Escreve uma mensagem..."></textarea></label>'+submit('Enviar')+'</form><div class="actions">'+(customer||role==='courier'||role==='producer'?studioBtn('Pedir operador','handoff'):'')+(['producer','admin'].includes(role)&&waiting&&waiting.status==='waiting'?studioBtn('Assumir conversa','claim',waiting.id):'')+'</div></div>':empty('Sem conversas','As solicitações de clientes aparecem aqui.'))}
function v10ReviewAction(o){return o.stage===4&&['buyer','company'].includes(role)&&o.role===role?'<div class="panel"><p>Avaliar '+esc(o.name)+'</p>'+studioBtn(studio.reviews.some(r=>r.order===o.id&&r.from===role)?'Editar avaliação':'Avaliar fornecedor','review',o.id)+'</div>':''}
function v10ReviewForm(id){const o=db.orders.find(x=>x.id===id&&x.role===role&&x.stage===4);if(!o||!['buyer','company'].includes(role))return;const r=studio.reviews.find(x=>x.order===id&&x.from===role)||{};show('Avaliar fornecedor','<form id="studioReview" data-id="'+esc(id)+'"><p>'+esc(o.name)+' · '+esc(allStalls().find(s=>s.id===o.stall)?.name||'Bancada')+'</p>'+select('Estrelas','stars',['5','4','3','2','1'],String(r.stars||5))+'<label class="field">Comentário<textarea name="comment" maxlength="600" rows="4" required>'+esc(r.comment||'')+'</textarea></label><p class="opstext">A avaliação ficará associada à encomenda concluída localmente. Testemunhos favoráveis podem ser públicos após aprovação; a distribuição integral fica na área profissional.</p>'+submit('Guardar avaliação')+'</form>')}
function stars(n){return '<span class="review-stars" aria-label="'+n+' de 5 estrelas">'+('★'.repeat(n)+'☆'.repeat(5-n))+'</span>'}
function reviewsPage(){const rows=studio.reviews.filter(reviewVisible);const avg=rows.length?rows.reduce((n,r)=>n+r.stars,0)/rows.length:0;return heading('Avaliações','Consulta integral das avaliações relevantes')+'<div class="metrics">'+metric('Avaliações',rows.length,'Registos locais')+metric('Média',rows.length?avg.toFixed(1)+' / 5':'—','Todas as notas')+'</div>'+rows.map(r=>'<div class="bizcard">'+stars(r.stars)+'<p>'+esc(r.comment)+'</p><p class="muted">'+roleNames[r.from]+' · '+(r.order?'Encomenda concluída local':'Sem compra verificada')+' · '+esc(r.status)+'</p><div class="actions">'+(role==='admin'?studioBtn('Aprovar','approveReview',r.id)+studioBtn('Ocultar','hideReview',r.id):studioBtn('Solicitar revisão','reportReview',r.id))+'</div></div>').join('')+(rows.length?'':empty('Sem avaliações','As avaliações surgem após encomendas concluídas.'))}
function publicReviews(s){const rows=studio.reviews.filter(r=>r.stall===s&&(!r.targetRole||r.targetRole==='producer')&&r.stars>=4&&r.status==='approved'&&!!r.order);return section('Avaliações da bancada',(['buyer','company'].includes(role)?'<div class="panel review-intro"><h3>Como foi a tua experiência?</h3><p class="muted">Avalia o fornecedor com estrelas e um comentário.</p>'+studioBtn('Avaliar fornecedor','reviewStall',s,'')+'</div>':'')+(rows.length?rows.map(r=>'<div class="bizcard">'+stars(r.stars)+'<p>'+esc(r.comment)+'</p><p class="muted">'+(r.seeded?esc(r.author||'Cliente fictício')+' · Comentário fictício':'Avaliação de teste após encomenda local')+'</p></div>').join('')+'<p class="opstext">Seleção de comentários favoráveis, não representa todas as avaliações.</p>':empty('Sem testemunhos publicados','As avaliações são moderadas.')))}
function moderationPage(){return v8ModerationPage()+section('Linguagem sinalizada','<div class="panel">'+(studio.flags.map(f=>'<div class="line"><div><strong>'+esc(f.where)+'</strong><div class="muted">'+roleNames[f.role]+' · '+esc(f.status)+'</div></div>'+studioBtn('Rever','flagDone',f.id)+'</div>').join('')||'<p class="muted">Nenhuma ocorrência.</p>')+'</div>')+section('Avaliações','<div class="panel"><button class="btn outline" data-go="reviews">Rever avaliações</button></div>')}
function mediaDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('Vídeo local indisponível neste navegador'));return}const r=window.indexedDB.open('zunga-media-v10',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('Não foi possível abrir a galeria'))})}
async function mediaWrite(file){const d=await mediaDB();return new Promise((resolve,reject)=>{const tx=d.transaction('media','readwrite');if(file)tx.objectStore('media').put(file,'stallVideo');else tx.objectStore('media').delete('stallVideo');tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(Error('Não foi possível guardar vídeo'))}})}
function clearMedia(){mediaWrite(null).catch(()=>{})}
let videoURL='';
async function hydrateVideo(){const v=$('#stallVideo');if(videoURL){URL.revokeObjectURL(videoURL);videoURL=''}if(!v||!studio.video)return;try{const d=await mediaDB(),file=await new Promise((resolve,reject)=>{const r=d.transaction('media').objectStore('media').get('stallVideo');r.onsuccess=()=>resolve(r.result);r.onerror=reject});d.close();if(file&&v.isConnected){videoURL=URL.createObjectURL(file);v.src=videoURL}}catch{}}
function galleryView(){return '<div class="media-gallery">'+studio.gallery.filter(imageSafe).map((s,i)=>'<img src="'+s+'" alt="Fotografia da bancada '+(i+1)+'" loading="lazy">').join('')+'</div>'+(studio.video?'<video id="stallVideo" controls playsinline preload="metadata" style="width:100%;border-radius:20px;margin-top:12px"></video>':'')}
function galleryManager(){return section('Galeria e vídeo de apresentação','<div class="panel">'+galleryView()+'<p class="opstext">Até quatro fotos de 350 KB e um vídeo MP4/WebM de 15 MB. Apenas neste navegador.</p><form id="studioGallery"><label class="field">Adicionar fotografias<input type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple></label><label class="field">Vídeo de apresentação<input type="file" name="video" accept="video/mp4,video/webm"></label><label class="checkbox"><input name="clearPhotos" type="checkbox"> Limpar fotografias anteriores</label><label class="checkbox"><input name="clearVideo" type="checkbox"> Remover vídeo anterior</label>'+submit('Guardar galeria')+'</form></div>')}
function customerStallPage(){const s=allStalls().find(x=>x.id===selectedStall);return v9StallPage()+(s?(['buyer','company'].includes(role)?'<div class="panel">'+studioBtn('Conversar com fornecedor','chatStall',s.id,'')+'</div>':'')+(s.id==='mine'&&(studio.gallery.length||studio.video)?section('Apresentação', '<div class="panel">'+galleryView()+'</div>'):'')+publicReviews(s.id):'')}

function tierFields(p){const ts=unitTiers(p);return '<div class="panel"><h3>Preços por quantidade</h3><p class="muted">Dois escalões opcionais; o preço unitário é aplicado à quantidade inteira.</p>'+[0,1].map(i=>'<div class="formrow">'+input('A partir de ('+(i+1)+')','tierQty'+i,ts[i]?.min||'','type="number" min="2" max="1000000"')+input('Preço unitário (Kz)','tierPrice'+i,ts[i]?.price||'','type="number" min="1" max="1000000000"')+'</div>').join('')+'</div>'}
function readTiers(v,base,minimum){const ts=[];let lastQty=minimum,lastPrice=base;for(let i=0;i<2;i++){const a=v['tierQty'+i],b=v['tierPrice'+i];if(!a&&!b)continue;const min=Number(a),price=Number(b);if(!a||!b||!Number.isSafeInteger(min)||min<=lastQty||min>1e6||!Number.isSafeInteger(price)||price<1||price>=lastPrice)return null;ts.push({min,price});lastQty=min;lastPrice=price}return ts}
function priceBreakdown(p){const tiers=unitTiers(p);return tiers.length?'<div class="tier-box"><h3>Compra por quantidade</h3><div class="line"><span>Preço normal</span><strong>'+money(p.price)+' / '+esc(p.unit)+'</strong></div>'+tiers.map(t=>'<div class="line"><span>A partir de '+t.min+' '+esc(p.unit)+'</span><strong>'+money(t.price)+' / '+esc(p.unit)+'</strong></div>').join('')+'<p class="muted">Desconto automático no carrinho ou na encomenda. Preços de demonstração.</p></div>':''}
function reservedQty(id){return db.orders.filter(o=>o.product===id&&o.commerceV13&&o.stage<3).reduce((n,o)=>n+o.qty,0)}
function stockMoves(){if(!Array.isArray(db.stockMoves))db.stockMoves=[];return db.stockMoves}
function logStock(p,delta,reason,ref){stockMoves().unshift({id:uid(),product:p.id,name:p.name,unit:p.unit,delta,reason,ref,date:Date.now()})}
function canCancel(o){return !!o&&[0,1,2].includes(o.stage)&&!ops.jobs.some(j=>j.order===o.id)&&((['buyer','company'].includes(role)&&o.role===role)||(role==='producer'&&o.stall==='mine'))}
function orderCommercePanel(o){if(!o)return '';if(!o.commerceV13)return '<div class="panel"><p class="muted">Pedido anterior ao sistema de reservas. '+(o.stage===5?'Cancelado: '+esc(o.cancelReason||'Cancelado'):'A reposição automática não se aplica a este registo antigo.')+'</p>'+(canCancel(o)?studioBtn('Cancelar pedido','cancelCommerce',o.id,'danger small'):'')+'</div>';return '<div class="panel"><h3>'+esc(o.name)+'</h3><div class="line"><span>Preço unitário aplicado</span><strong>'+money(o.unitPrice)+'</strong></div><div class="line"><span>Estado da reserva</span><strong>'+ (o.stage===5?'Libertada':o.stage<3?'Reservada':'Expedida / concluída')+'</strong></div>'+(o.discount?'<p>Desconto: '+money(o.discount)+'</p>':'')+(o.stage<3&&reservationExpired(o)?'<p class="shopalert">Lote reservado vencido. A expedição está bloqueada.</p>':'')+(canCancel(o)?studioBtn('Cancelar esta encomenda','cancelCommerce',o.id,'outline small'):'')+(o.stage===5?'<p class="muted">Motivo: '+esc(o.cancelReason||'Cancelada')+'</p>':'')+'</div>'}
function cancelCommerce(id,reason){const o=db.orders.find(x=>x.id===id);if(!canCancel(o)||typeof reason!=='string'||!reason.trim()||reason.length>300)return false;const before=JSON.stringify(db);markCancelled(o,reason);if(!save()){Object.assign(db,JSON.parse(before));return false}return true}
function oldInventoryPage(){const products=db.products,orders=db.orders.filter(o=>o.stall==='mine'&&o.commerceV13),moves=stockMoves();return heading('Armazém e reservas','Controlo de stock por produto · ambiente local')+'<div class="notice">O stock disponível já exclui as novas reservas. Pedidos antigos não são recalculados; não existe sincronização entre dispositivos.</div>'+section('Inventário',products.map(p=>'<div class="panel"><div class="line"><div><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.unit)+'</p></div>'+studioBtn('Movimentar','stockMove',p.id)+' '+btn('Stock','adjustStock',p.id,'outline small')+'</div><div class="stock-grid"><div><small>Disponível</small><strong>'+p.stock+'</strong></div><div><small>Reservado</small><strong>'+reservedQty(p.id)+'</strong></div><div><small>Em mãos¹</small><strong>'+(p.stock+reservedQty(p.id))+'</strong></div></div>'+(p.stock<=5?'<p class="opstext">Atenção: stock baixo.</p>':'')+'</div>').join('')||empty('Sem produtos','Adiciona produtos no catálogo.'))+section('Reservas e saídas',orders.map(o=>'<div class="bizcard"><div class="line"><div><h3>'+esc(o.name)+'</h3><p class="muted">'+o.qty+' '+esc(o.unit)+' · #'+esc(o.id.slice(-6).toUpperCase())+'</p></div><span class="status">'+esc(stages[o.stage])+'</span></div>'+btn('Ver pedido','order',o.id,'outline small')+'</div>').join('')||empty('Sem novas reservas','As próximas encomendas surgem aqui.'))+section('Ajustes manuais',moves.map(m=>'<div class="line"><div><strong>'+esc(m.name)+'</strong><p class="muted">'+esc(m.reason)+' · '+new Date(m.date).toLocaleDateString('pt-AO')+'</p></div><strong>'+ (m.delta>0?'+':'')+m.delta+' '+esc(m.unit)+'</strong></div>').join('')||empty('Sem ajustes','Os ajustes de catálogo e stock serão registados.'))+'<p class="opstext">¹ Disponível mais as reservas ainda não expedidas; não substitui contagem física de armazém.</p>'}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-studio="cancelCommerce"]');if(!b)return;const o=db.orders.find(x=>x.id===b.dataset.id);if(!canCancel(o))return;show('Cancelar encomenda','<form id="commerceCancel" data-id="'+esc(o.id)+'"><p>'+esc(o.name)+' · '+o.qty+' '+esc(o.unit)+'</p><p class="muted">Se existir uma reserva criada pela V0.13 ou posterior, será libertada. Não existe reembolso porque não houve cobrança.</p><label class="field">Motivo<textarea name="reason" rows="3" required maxlength="300"></textarea></label>'+submit('Confirmar cancelamento')+'</form>')});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='commerceCancel')return;e.preventDefault();const v=formData(f);if(v.reason?.length<=300&&!flagText(v.reason,'Cancelamento')&&cancelCommerce(f.dataset.id,v.reason)){close();render();toast('Encomenda cancelada')}});

/* V0.13 — estimativa de transporte e conversão de cotações. */
function deliveryShares(rows,mode,a){const shares={},cfg=v16Settings();if(mode!=='delivery'||!a)return shares;const groups={};for(const r of rows){if(r.p)(groups[r.p.stall]??=[]).push(r)}for(const [sid,items] of Object.entries(groups)){const s=allStalls().find(x=>x.id===sid)||{};const fee=norm(s.province||'')===norm(a.province||'')?(norm(s.city||'')===norm(a.city||'')?cfg.localFee:cfg.provinceFee):cfg.nationalFee;const base=Math.floor(fee/items.length);items.forEach((r,i)=>{shares[r.id]=base+(i===items.length-1?fee-base*items.length:0)})}return shares}
function deliveryTotal(rows,mode,a){return Object.values(deliveryShares(rows,mode,a)).reduce((n,v)=>n+v,0)}
function quoteProduct(q,r){if(!q||!r)return null;const candidates=allProducts().filter(p=>p.stall===r.stall&&p.unit===q.unit&&(r.product?p.id===r.product:norm(p.name)===norm(q.name)));return candidates.length===1?candidates[0]:null}
function quoteConversionPanel(q){const r=quoteResponses(q.id).find(x=>x.id===q.accepted),p=quoteProduct(q,r),qty=Number(q.qty);if(!p)return '<p class="muted">A proposta não está ligada inequivocamente a um produto do catálogo. Não é possível reservar stock automaticamente.</p>';if(!Number.isSafeInteger(qty)||qty<(p.minimum||1)||qty>sellable(p))return '<p class="shopalert">Stock ou quantidade mínima incompatível com a proposta.</p>';if(!Number.isSafeInteger(Number(r.price))||Number(r.price)<1||Number(r.price)>1e9)return '<p class="shopalert">O preço da proposta tem de ser um valor inteiro válido em Kz.</p>';return '<div class="panel"><h3>Transformar em encomenda</h3><p>'+esc(p.name)+' · '+qty+' '+esc(p.unit)+' · '+money(qty*r.price)+'</p><p class="muted">O preço aceite será guardado. Reserva local, levantamento a combinar, sem cobrança.</p>'+studioBtn('Confirmar encomenda e reservar','quoteOrder',q.id,'')+'</div>'}
function convertQuote(id){if(role!=='company'||!business.signed)return null;const q=db.quotes.find(x=>x.id===id&&quoteStatus(x)==='accepted');if(!q||db.orders.some(o=>o.quote===id))return null;const r=quoteResponses(q.id).find(x=>x.id===q.accepted),p=quoteProduct(q,r),qty=Number(q.qty),price=Number(r?.price);if(!p||!Number.isSafeInteger(qty)||qty<(p.minimum||1)||qty>sellable(p)||!Number.isSafeInteger(price)||price<1||price>1e9||!Number.isSafeInteger(qty*price))return null;if(!v16AllowOrder('company',qty*price,'pickup'))return null;const oldStock=p.stock,oldLots=JSON.stringify(p.lots||[]),o={id:uid(),quote:id,product:p.id,stall:p.stall,name:p.name,qty,unit:p.unit,total:qty*price,unitPrice:price,financeV16:v16Split(qty*price,0,v16Settings()),commerceV13:true,stage:0,role:'company',date:Date.now(),demo:true,mode:'pickup',slot:'A combinar'};db.orders.unshift(o);if(db.products.includes(p))reserveOwn(p,o);if(!save()){db.orders.shift();p.stock=oldStock;p.lots=JSON.parse(oldLots);return null}return o}
function stockMovement(id,kind,qty,reason){if(!v16InventoryAccess()||!['entry','exit'].includes(kind)||!Number.isSafeInteger(qty)||qty<1||qty>1e6||typeof reason!=='string'||!reason.trim()||reason.length>300)return false;const p=db.products.find(x=>x.id===id);if(!p)return false;const before=p.stock,delta=kind==='entry'?qty:-qty;if(before+delta<lotTotal(p)||before+delta>1e6)return false;const moves=stockMoves();p.stock+=delta;const m=movementRecord(p,{code:'Sem lote',warehouse:'principal'},kind,qty,(kind==='entry'?'Entrada: ':'Saída: ')+reason.trim(),{warehouse:'Stock sem localização atribuída'});if(!save()){p.stock=before;moves.shift();return false}return m}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-studio="quoteOrder"],[data-studio="stockMove"]');if(!b)return;if(b.dataset.studio==='quoteOrder'){const o=convertQuote(b.dataset.id);if(!o){toast('Revê a proposta e o stock disponível');return}close();navigate('orders');operationDone('Encomenda registada · stock reservado','order',o.id);return}const p=db.products.find(x=>x.id===b.dataset.id);if(!v16InventoryAccess()||!p)return;show('Movimentar stock','<form id="commerceMovement" data-id="'+esc(p.id)+'"><p>'+esc(p.name)+' · '+p.stock+' '+esc(p.unit)+' disponíveis</p>'+'<label class="field">Movimento<select name="kind"><option value="entry">Entrada</option><option value="exit">Saída</option></select></label>'+input('Quantidade','qty',1,'type="number" min="1" max="1000000" required')+'<label class="field">Motivo<textarea name="reason" required maxlength="300" rows="3"></textarea></label><p class="muted">As saídas não podem consumir stock reservado.</p>'+submit('Registar movimento')+'</form>')});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='commerceMovement')return;e.preventDefault();const v=formData(f);if(flagText(v.reason||'','Movimento de stock'))return;if(!stockMovement(f.dataset.id,v.kind,Number(v.qty),v.reason)){toast('Quantidade, motivo ou stock insuficiente');return}if(role==='admin')opLog('Movimento administrativo '+f.dataset.id+' · '+v.reason);close();render();moveExport(stockMoves()[0].id)});

function cancelGroup(id,reason){if(role!=='buyer'||typeof reason!=='string'||!reason.trim()||reason.length>300)return false;const g=orderGroups().find(x=>x.id===id);const orders=g?.items.filter(canCancel)||[];if(!orders.length)return false;const before=JSON.stringify(db);for(const o of orders)markCancelled(o,reason);if(!save()){Object.assign(db,JSON.parse(before));return false}return true}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-studio="cancelGroup"]');if(!b||role!=='buyer')return;const g=orderGroups().find(x=>x.id===b.dataset.id),items=g?.items.filter(canCancel)||[];if(!items.length)return;show('Cancelar compra','<form id="cancelGroupForm" data-id="'+esc(g.id)+'"><p>Serão cancelados '+items.length+' de '+g.items.length+' produto(s).</p>'+items.map(o=>'<div class="line"><span>'+esc(o.name)+'</span><strong>'+o.qty+' '+esc(o.unit)+'</strong></div>').join('')+'<p class="muted">Itens com entrega atribuída, em transporte ou entregues não serão cancelados. Apenas reservas confirmadas serão repostas.</p><label class="field">Motivo<textarea name="reason" required maxlength="300" rows="3"></textarea></label>'+submit('Confirmar cancelamento')+'</form>')});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='cancelGroupForm')return;e.preventDefault();const v=formData(f);if(flagText(v.reason||'','Cancelamento'))return;if(cancelGroup(f.dataset.id,v.reason)){close();orderFilter='cancelled';render();toast('Compra cancelada · itens elegíveis')}else toast('Não foi possível cancelar os itens')});


/* V0.14 — armazéns, lotes e reservas FEFO. */
function lotsOf(p){return Array.isArray(p?.lots)?p.lots:[]}
function lotTotal(p){return lotsOf(p).reduce((n,l)=>n+l.qty,0)}
function todayISO(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function expired(l){return !!l.expiry&&l.expiry<todayISO()}
function sellable(p){return p?Math.max(0,p.stock-lotsOf(p).filter(expired).reduce((n,l)=>n+l.qty,0)):0}
function warehouseList(){return Array.isArray(db.warehouses)?db.warehouses:[{id:'principal',name:'Armazém principal',location:'Bancada local'}]}
function warehouseName(id){return warehouseList().find(w=>w.id===id)?.name||'Sem localização'}
function warehouseOptions(selected){return warehouseList().map(w=>'<option value="'+esc(w.id)+'" '+(w.id===selected?'selected':'')+'>'+esc(w.name)+'</option>').join('')}
function reserveOwn(p,o){let left=o.qty;o.lots=[];for(const l of lotsOf(p).filter(l=>l.qty>0&&!expired(l)).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'))){const n=Math.min(left,l.qty);if(!n)break;l.qty-=n;left-=n;o.lots.push({id:l.id,qty:n,code:l.code,warehouse:l.warehouse})}p.stock-=o.qty;o.unallocatedQty=left}
function reservationExpired(o){const p=db.products.find(x=>x.id===o.product);return (o.lots||[]).some(a=>{const l=lotsOf(p).find(x=>x.id===a.id);return !l||expired(l)})}
function markCancelled(o,reason){const p=db.products.find(x=>x.id===o.product);o.stage=5;o.cancelReason=reason.trim();o.cancelledAt=Date.now();if(p&&o.commerceV13){p.stock+=o.qty;for(const a of o.lots||[]){const l=lotsOf(p).find(x=>x.id===a.id);if(l)l.qty+=a.qty}}}
function lotReserved(id){return db.orders.filter(o=>o.commerceV13&&o.stage<3).flatMap(o=>o.lots||[]).filter(a=>a.id===id).reduce((n,a)=>n+a.qty,0)}
function warehouseAdd(name,location){if(!v16InventoryAccess()||!name?.trim()||name.length>80||String(location||'').length>120||warehouseList().some(w=>norm(w.name)===norm(name.trim())))return false;const before=db.warehouses;db.warehouses=[...warehouseList(),{id:uid(),name:name.trim(),location:String(location||'').trim()}];if(!save()){db.warehouses=before;return false}return true}
function movementRecord(p,l,kind,qty,reason,extra={}){const m={id:uid(),v14:true,product:p.id,name:p.name,unit:p.unit,delta:kind==='entry'?qty:['exit','loss'].includes(kind)?-qty:0,qty,kind,reason,lot:l.code,warehouse:warehouseName(l.warehouse),destination:'',expiry:l.expiry||'',person:profileInfo().name||'Fornecedor demo',date:Date.now(),...extra};stockMoves().unshift(m);return m}
function createLot(id,v){if(!v16InventoryAccess())return null;const p=db.products.find(x=>x.id===id),qty=Number(v.qty),kind=v.kind,code=String(v.code||'').trim(),reason=String(v.reason||'').trim(),expiry=v.expiry||'';if(!p||!['entry','classify'].includes(kind)||!Number.isSafeInteger(qty)||qty<1||qty>1e6||!code||code.length>60||!reason||reason.length>300||!warehouseList().some(w=>w.id===v.warehouse)||expiry&&!/^\d{4}-\d{2}-\d{2}$/.test(expiry)||lotsOf(p).some(l=>l.warehouse===v.warehouse&&norm(l.code)===norm(code)))return null;if(kind==='classify'&&qty>p.stock-lotTotal(p)||kind==='entry'&&p.stock+qty>1e6)return null;const before=JSON.stringify(db);p.lots=lotsOf(p);const l={id:uid(),code,warehouse:v.warehouse,qty,expiry,date:Date.now()};p.lots.push(l);if(kind==='entry')p.stock+=qty;const m=movementRecord(p,l,kind,qty,(kind==='entry'?'Entrada: ':'Classificação: ')+reason);if(!save()){Object.assign(db,JSON.parse(before));return null}return m}
function moveLot(product,id,v){if(!v16InventoryAccess())return null;const p=db.products.find(x=>x.id===product),l=lotsOf(p).find(x=>x.id===id),qty=Number(v.qty),kind=v.kind,reason=String(v.reason||'').trim();if(!l||!['exit','loss','transfer'].includes(kind)||!Number.isSafeInteger(qty)||qty<1||qty>l.qty||!reason||reason.length>300)return null;if(kind==='transfer'&&(!warehouseList().some(w=>w.id===v.destination)||v.destination===l.warehouse))return null;const before=JSON.stringify(db);l.qty-=qty;let dest='';if(kind==='transfer'){dest=warehouseName(v.destination);const target=lotsOf(p).find(x=>x.warehouse===v.destination&&x.code===l.code&&x.expiry===l.expiry);if(target)target.qty+=qty;else p.lots.push({...l,id:uid(),warehouse:v.destination,qty})}else p.stock-=qty;const m=movementRecord(p,l,kind,qty,({exit:'Saída',loss:'Perda',transfer:'Transferência'}[kind])+': '+reason,{destination:dest});if(!save()){Object.assign(db,JSON.parse(before));return null}return m}
function movementRows(m){return [['SUMBA — Ficha de movimentação'],['Demonstração — sem validade fiscal'],['Referência',m.id],['Data',new Date(m.date).toLocaleString('pt-AO')],['Responsável',m.person],['Operação',m.reason],['Produto',m.name],['Lote',m.lot],['Quantidade',m.qty,m.unit],['Armazém',m.warehouse],['Destino',m.destination||'—'],['Validade',m.expiry||'—'],['Variação de stock físico não reservado',m.delta],['Nota','Operação já aplicada; descarregar não altera stock.']]}

function inventoryPage(){const ps=db.products,ws=warehouseList(),moves=stockMoves(),near=l=>l.qty>0&&l.expiry&&!expired(l)&&Math.ceil((new Date(l.expiry+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000)<=v16Settings().expiryDays;const alerts=ps.flatMap(p=>lotsOf(p).filter(l=>l.qty>0&&(expired(l)||near(l))).map(l=>({p,l})));return heading('Armazéns e inventário','Lotes, validade, reservas e movimentações')+'<div class="notice">Demonstração local. Lotes vencidos não podem ser vendidos. Reservas novas usam primeiro os lotes com validade mais próxima.</div><div class="metrics">'+metric('Armazéns',ws.length,'Localizações')+metric('Lotes ativos',ps.flatMap(lotsOf).filter(l=>l.qty>0).length,'Com saldo disponível')+metric('Alertas de validade',alerts.length,'Vencidos ou até '+v16Settings().expiryDays+' dias')+metric('Stock baixo',ps.filter(p=>sellable(p)<=v16Settings().lowStock).length,'Limite demonstrativo: '+v16Settings().lowStock)+'</div>'+section('Armazéns',ws.map(w=>'<div class="panel"><h3>'+esc(w.name)+'</h3><p class="muted">'+esc(w.location)+' · '+ps.flatMap(lotsOf).filter(l=>l.warehouse===w.id&&l.qty>0).length+' lotes</p></div>').join(''),studioBtn('+ Armazém','warehouseAdd'))+section('Alertas',alerts.map(({p,l})=>'<div class="panel"><strong>'+esc(p.name)+' · '+esc(l.code)+'</strong><p>'+ (expired(l)?'Vencido':'A vencer')+' · '+esc(l.expiry)+' · '+l.qty+' '+esc(p.unit)+'</p></div>').join('')||empty('Sem alertas','Validades próximas aparecem aqui.'))+section('Inventário por produto',ps.map(p=>'<div class="panel"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.unit)+' · '+(p.stock-lotTotal(p))+' sem lote atribuído</p><div class="stock-grid"><div><small>Vendável</small><strong>'+sellable(p)+'</strong></div><div><small>Reservado</small><strong>'+reservedQty(p.id)+'</strong></div><div><small>Em mãos</small><strong>'+(p.stock+reservedQty(p.id))+'</strong></div></div><div class="actions">'+studioBtn('+ Lote','lotAdd',p.id,'small')+studioBtn('Movimento sem lote','st function v15Transition(j,o,action,expired,proof){
  if(!j||!o||j.incident?.open||o.stage===5)return null;
  if(action==='accept'&&j.status==='assigned'&&o.stage===2)return ['accepted',2];
  if(action==='pickup'&&j.status==='accepted'&&o.stage===2&&!expired)return ['transit',3];
  if(action==='deliver'&&j.status==='transit'&&o.stage===3&&proof===true)return ['delivered',4];
  return null;
}

function sumbaEnsureBaskets(){
 if(!Array.isArray(shop.baskets)||!shop.baskets.length){
  shop.baskets=[{id:'principal',name:'Cesto principal',items:{...shop.cart},updated:Date.now()}];
  shop.activeBasketId='principal';
 }
 shop.baskets=shop.baskets.filter(b=>b&&typeof b.id==='string'&&b.items&&typeof b.items==='object'&&!Array.isArray(b.items)).slice(0,15);
 if(!shop.baskets.length)shop.baskets=[{id:'principal',name:'Cesto principal',items:{...shop.cart},updated:Date.now()}];
 if(!shop.baskets.some(b=>b.id===shop.activeBasketId))shop.activeBasketId=shop.baskets[0].id;
 if(!Array.isArray(shop.payments))shop.payments=[];
}
function sumbaPersistActiveBasket(){
 sumbaEnsureBaskets();
 const b=shop.baskets.find(x=>x.id===shop.activeBasketId);
 if(b){b.items={...shop.cart};b.updated=Date.now()}
}
function sumbaSwitchBasket(id){
 sumbaEnsureBaskets();
 if(id===shop.activeBasketId)return;
 const next=shop.baskets.find(b=>b.id===id);if(!next)return;
 sumbaPersistActiveBasket();shop.activeBasketId=next.id;shop.cart={...next.items};
 shop.coupon='';saveShop();navigate('cart');
}
function sumbaBasketForm(rename=false){
 sumbaEnsureBaskets();
 const active=shop.baskets.find(b=>b.id===shop.activeBasketId);
 show(rename?'Renomear cesto':'Criar um cesto','<form id="sumbaBasketForm" data-rename="'+(rename?'yes':'no')+'">'+
 '<label class="field">Nome do cesto<input name="basketName" maxlength="40" required autocomplete="off" value="'+esc(rename?active.name:'')+'" placeholder="Ex.: Compras de sábado"></label>'+
 '<p class="muted">Cada cesto tem produtos e uma compra independentes. Os dados ficam apenas neste navegador.</p>'+
 '<button type="submit" class="btn">'+(rename?'Guardar nome':'Criar cesto')+'</button></form>');
}
function sumbaBuySeparateStall(stall){
 sumbaEnsureBaskets();
 if(shop.baskets.length>=15){toast('Limite de 15 cestos de demonstração');return}
 const selected={},rest={};
 for(const [id,n] of Object.entries(shop.cart)){
  const p=productOf(id);
  if(p?.stall===stall)selected[id]=n;else rest[id]=n;
 }
 if(!Object.keys(selected).length)return;
 const name=allStalls().find(x=>x.id===stall)?.name||'Bancada';
 shop.cart=rest;sumbaPersistActiveBasket();
 const b={id:uid(),name:name.slice(0,40),items:selected,updated:Date.now()};
 shop.baskets.push(b);shop.activeBasketId=b.id;shop.cart={...selected};
 shop.coupon='';saveShop();navigate('cart');
 toast('Produtos desta bancada separados num novo cesto.');
}

checkoutPage=function(){
 const html=sumbaLegacyCheckoutPage();
 return checkoutStep===3?html.replace('<div class="checkout-actions"><button type="button" class="btn outline" data-shop="checkoutBack">Voltar</button>',sumbaPaymentFields()+'<div class="checkout-actions"><button type="button" class="btn outline" data-shop="checkoutBack">Voltar</button>'):html;
};
function sumbaPaymentLabel(p){
 return p?.status==='approved_demo'?'Pagamento aprovado (simulado)':
 p?.status==='pending_demo'?'A aguardar aprovação (simulação)':
 p?.status==='on_delivery_demo'?'Pagamento na entrega (simulado)':'Sem pagamento de demonstração';
}
function sumbaCompleteDemoPayment(id){
 sumbaEnsureBaskets();
 const p=shop.payments.find(x=>x.id===id);if(!p||p.status!=='pending_demo')return;
 p.status='approved_demo';p.verifiedAt=Date.now();saveShop();
 db.orders.filter(x=>x.group===p.group).forEach(o=>{if(o.paymentDemo)o.paymentDemo.status=p.status});
 save();sumbaDemoEvent('payment','Pagamento fictício aprovado','A verificação automática de demonstração foi concluída. Nenhuma transacção financeira ocorreu.',false);
 if(role==='buyer'&&['confirmation','orders'].includes(tab))render();
}
function sumbaResumeDemoPayments(){
 sumbaEnsureBaskets();
 shop.payments.filter(p=>p.status==='pending_demo').forEach(p=>{
  const remaining=Math.max(350,2500-(Date.now()-p.createdAt));
  setTimeout(()=>sumbaCompleteDemoPayment(p.id),remaining);
 });
}
const sumbaLegacyConfirmation=purchaseConfirmation;
purchaseConfirmation=function(){
 const html=sumbaLegacyConfirmation();
 const p=shop.payments?.find(x=>x.group===lastPurchase);
 return html+(p?'<section class="panel sumba-payment-result" aria-live="polite"><h3>Pagamento de teste</h3>'+
 '<p><span class="sumba-payment-status">'+esc(sumbaPaymentLabel(p))+'</span></p>'+
 '<p class="muted">Referência: '+esc(p.reference)+' · Total de produtos e entrega simulados: '+money(p.amount)+'</p>'+
 '<p class="shopnotice">Nenhum valor foi cobrado. A verificação é gerada localmente para avaliação do projecto.</p></section>':'');
};
const sumbaLegacyPurchaseDetails=purchaseDetails;
purchaseDetails=function(id){
 sumbaLegacyPurchaseDetails(id);
 const p=shop.payments?.find(x=>x.group===id);
 if(p&&$('#dialog')?.open)$('#dialogBody').insertAdjacentHTML('beforeend','<section class="panel"><h3>Pagamento de demonstração</h3>'+
 '<span class="sumba-payment-status">'+esc(sumbaPaymentLabel(p))+'</span><p class="muted">Referência '+esc(p.reference)+
 ' · '+money(p.amount)+'</p><p>Não houve contacto com o Multicaixa Express.</p></section>');
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-sumba-basket]');if(!b||role!=='buyer')return;
 e.preventDefault();
 const action=b.dataset.sumbaBasket,id=b.dataset.id;
 sumbaEnsureBaskets();
 if(action==='open')sumbaSwitchBasket(id);
 if(action==='new'){if(shop.baskets.length>=15){toast('Limite de 15 cestos');return}sumbaBasketForm(false)}
 if(action==='rename')sumbaBasketForm(true);
 if(action==='split')sumbaBuySeparateStall(id);
 if(action==='delete'){
  if(!confirm('Eliminar este cesto e os seus produtos guardados? O histórico de pedidos permanecerá disponível.'))return;
  if(shop.baskets.length===1){shop.cart={};saveShop();render();return}
  const active=shop.activeBasketId;shop.baskets=shop.baskets.filter(x=>x.id!==active);
  shop.activeBasketId=shop.baskets[0].id;shop.cart={...shop.baskets[0].items};shop.coupon='';
  saveShop();render();
 }
});
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.id==='sumbaBasketForm'){
  e.preventDefault();e.stopImmediatePropagation();if(role!=='buyer')return;
  const name=String(new FormData(f).get('basketName')||'').trim().slice(0,40);
  if(!name){toast('Escolhe um nome para o cesto');return}
  if(f.dataset.rename==='yes'){
   sumbaEnsureBaskets();const b=shop.baskets.find(x=>x.id===shop.activeBasketId);
   if(b)b.name=name;
  }else{
   if(shop.baskets.length>=15)return;
   sumbaPersistActiveBasket();
   const b={id:uid(),name,items:{},updated:Date.now()};
   shop.baskets.push(b);shop.activeBasketId=b.id;shop.cart={};shop.coupon='';
  }
  if(saveShop()){close();navigate('cart')}
  return;
 }
 if(f.id!=='shopCheckout'||role!=='buyer'||checkoutStep!==3)return;if(sumbaGuestBrowsing()){e.preventDefault();e.stopImmediatePropagation();toast('Não é possível concluir compras como visitante.');return}
 e.preventDefault();e.stopImmediatePropagation();
 const data=new FormData(f),method=String(data.get('sumbaPaymentMethod')||'express');
 const nif=String(data.get('sumbaDemoNif')||'').trim(),phone=String(data.get('sumbaDemoPhone')||'').trim();
 if(nif&&!/^\d{10}$/.test(nif)){toast('NIF fictício: introduz 10 algarismos');return}
 if(!['express','delivery'].includes(method)){toast('Escolhe o método de pagamento');return}
 if(method==='express'&&!/^9\d{8}$/.test(phone)){toast('Número fictício: introduz 9 dígitos começados por 9');return}
 if(!cartValid()){toast('Revê as quantidades deste cesto');navigate('cart');return}
 const amount=cartSubtotal()-discount()+deliveryTotal(cartRows(),shop.mode,address());
 if(!placeCart({mode:shop.mode,slot:shop.slot})){toast('Não foi possível confirmar o pedido deste cesto');return}
 const p={id:uid(),reference:'SUMBA-DEMO-'+Math.random().toString(36).slice(2,10).toUpperCase(),group:lastPurchase,
  amount,method,status:method==='express'?'pending_demo':'on_delivery_demo',
  phoneLast3:method==='express'?phone.slice(-3):'',nifLast4:nif.slice(-4),createdAt:Date.now()};
 sumbaEnsureBaskets();shop.payments.unshift(p);shop.payments=shop.payments.slice(0,100);
 db.orders.filter(o=>o.group===p.group).forEach(o=>{o.paymentDemo={method:p.method,status:p.status,reference:p.reference,nifLast4:p.nifLast4}});
 save();saveShop();orderFilter='active';navigate('confirmation');
 if(method==='express')setTimeout(()=>sumbaCompleteDemoPayment(p.id),2500);
},true);
sumbaEnsureBaskets();
sumbaResumeDemoPayments();

const entryRole=({client:'buyer',business:'producer',company:'company',admin:'admin',courier:'courier'})[new URLSearchParams(location.search).get?.('app')];if(entryRole){role=entryRole;db.role=role;save()}

let sumbaVisitorSession=null;
try{const saved=JSON.parse(sessionStorage.getItem(SUMBA_VISITOR_KEY)||'null');if(saved&&typeof saved.name==='string'&&saved.name.trim().length>=2&&['buyer','producer','company','courier'].includes(saved.role))sumbaVisitorSession=saved}catch{}
account.signed=false;account.guest=!!sumbaVisitorSession;
if(sumbaVisitorSession)account.name=sumbaVisitorSession.name;
role=sumbaVisitorSession?.role||'buyer';tab='home';db.role=role;
if(role==='producer'){producerAccount.signed=true;saveProducer()}
if(role==='company'){business.signed=true;saveBusiness()}
if(role==='courier'){ops.sessions.courier=true;saveOps()}
document.getElementById('sumbaPreviewRole')?.setAttribute('hidden','');
initPickers();
bindBackdropDismiss($('#dialog'),dismissDialog);$('#closeDialog').addEventListener('click',dismissDialog);$('#dialog').addEventListener('cancel',e=>{if(typeof $('#dialog').animate==='function'&&!reducedMotion()){e.preventDefault();dismissDialog()}});$('#dialog').addEventListener('close',()=>{activeStall=null});render();sumbaRefreshDemoBell();armBack();const params=new URLSearchParams(location.search);if(!sumbaVisitorSession)openAuth('welcome');
/* A experiência demonstrativa não utiliza sessões do Supabase. */
